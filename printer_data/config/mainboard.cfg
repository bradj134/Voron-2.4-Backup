#####################################################################
#   Mainboard - BTT Octopus V1 (USB)
#   Motion, bed heater, electronics-bay fans, case light
#####################################################################


#####################################################################
#   X/Y steppers (sensorless homing)
#####################################################################

##  B stepper - left - MOTOR_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400      # 0.9 degree motors
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80                  # Voron sensorless guide; pairs with 0.49 A homing current
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6                    # sensorless homing
driver_SGTHRS: 150                # max 255

##  A stepper - right - MOTOR_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400      # 0.9 degree motors
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80                  # Voron sensorless guide; pairs with 0.49 A homing current
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG9                    # sensorless homing
driver_SGTHRS: 150                # max 255


#####################################################################
#   Z steppers
#####################################################################
##  Z homes with the Cartographer (scan for G28, touch in PRINT_START).
##  No position_endstop: the probe supplies Z0.

##  Z0 - front left - MOTOR_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 320
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0            # required by Cartographer

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z1 - rear left - MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z2 - rear right - MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z3 - front right - MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999


#####################################################################
#   Bed heater (SSR on HE1, thermistor on TB)
#####################################################################
##  PID values live in printer.cfg's SAVE_CONFIG block.

[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
max_power: 1
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
max_error: 15
check_gain_time: 90
hysteresis: 10


#####################################################################
#   Electronics-bay and chamber fans
#####################################################################

[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
fan_speed: 0.5

##  Nevermore filter - FAN3. Hot prints only: PRINT_START turns it on
##  when the bed is 90C or hotter, and it keeps running for 10 minutes
##  after the print ends or is cancelled. Settings are in _NEVERMORE
##  (macros.cfg). It also shows as a fan slider in Mainsail and
##  KlipperScreen for manual use.
##  (It was a heater_fan before. Klipper's heater_fan runs whenever the
##  bed has any target, so it ran on every print, PLA included.)
[fan_generic nevermore]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0


#####################################################################
#   Lighting and sensors
#####################################################################

##  Chamber lighting - CNC_FAN5
[output_pin caselight]
pin: PD15
pwm: true
shutdown_value: 0
value: 0
cycle_time: 0.01

##  Octopus processor temperature (built into the chip)
[temperature_sensor octopus_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100


#####################################################################
#   KAMP (Klipper Adaptive Meshing & Purging) - purge and smart park
#####################################################################
##  Uses the official KAMP repo through the KAMP folder link in your
##  config directory (see the install steps). Only Line_Purge and
##  Smart_Park are included. KAMP's adaptive meshing stays OFF because
##  Klipper's own BED_MESH_CALIBRATE ADAPTIVE=1 replaces it, and
##  Cartographer handles probing.
##
##  PRINT_START calls SMART_PARK (heat next to the print) and
##  LINE_PURGE (purge just in front of it). Both need "Label objects"
##  on in the slicer. Without labels, PRINT_START falls back to the
##  front-edge purge.
##
##  LINE_PURGE needs max_extrude_cross_section: 5 in [extruder]
##  (set in toolhead.cfg).

[include ./KAMP/Line_Purge.cfg]
[include ./KAMP/Smart_Park.cfg]

[gcode_macro _KAMP_Settings]
description: Settings for KAMP's LINE_PURGE and SMART_PARK
variable_verbose_enable: True       # print purge and park positions to the console
variable_mesh_margin: 0             # adaptive meshing not used (Klipper's ADAPTIVE=1 instead)
variable_fuzz_amount: 0             # adaptive meshing not used
variable_probe_dock_enable: False   # Cartographer is not a docking probe
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'
variable_purge_height: 0.8          # nozzle Z during the purge (mm)
variable_tip_distance: 5            # matches the 5 mm retract at the end of PRINT_END
variable_purge_margin: 10           # purge line sits this far in front of the print (mm)
variable_purge_amount: 30           # filament purged (mm); the line is the same length
variable_flow_rate: 12              # purge flow (mm3/s)
variable_smart_park_height: 10      # Z while heating at the smart park spot (mm)
gcode:
    {action_respond_info("Running the KAMP_Settings macro does nothing, it only stores KAMP settings.")}

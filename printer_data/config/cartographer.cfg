#####################################################################
#   Cartographer V4 (CAN, through the Gen2 passthrough)
#   Probe, Z homing, gantry levelling, bed mesh, accelerometer
#####################################################################
##  Cartographer registers itself as the Klipper probe, so there is no
##  [probe] section. G28 Z, QGL and bed mesh use scan; PRINT_START sets
##  the true Z0 with CARTOGRAPHER_TOUCH_HOME. Calibration results are
##  saved by SAVE_CONFIG into printer.cfg.

[mcu cartographer]
## From canbus_query.py can0 after flashing the CAN firmware (2026-11-04)
canbus_uuid: ba37d4cf06e5

[cartographer]
mcu: cartographer
## Offset of the coil centre from the nozzle tip, in mm (measured:
## probe centred on the nozzle in X, 25.4 mm behind it in Y).
x_offset: 0
y_offset: 25.4
verbose: no
## Z lift speed for QGL lifts and touch retracts (default 5). 15 is your
## max_z_velocity. Lifts don't measure, so this doesn't change accuracy.
## Probing (measuring) speeds stay at Cartographer's defaults.
lift_speed: 15

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

#####################################################################
#   Homing (sensorless X/Y, Cartographer scan for Z)
#####################################################################
## Replaces [safe_z_home] (Klipper doesn't allow both). Follows
## Klipper's CoreXY sensorless guide and Voron's sensorless guide:
##  - Lifts Z 10 mm first, like safe_z_home did.
##  - Drops both A and B motors to the homing current for a soft hit.
##  - Waits 2 s before each sensorless home so the driver's stall flag
##    from the last move has cleared.
##  - Backs X off the frame before homing Y, so the carriage pressing
##    on the X end can't throw off Y's stall detection.
##  - Restores run current, then scan-homes Z at the bed centre
##    (Cartographer requirement).
## G28 X, G28 Y and G28 Z each home only that axis, like before.
## If you change home_current or homing_speed, retune driver_SGTHRS.
## If a home ever fails with an error, the motors stay at the homing
## current: run FIRMWARE_RESTART (or a successful G28) before printing.
[homing_override]
axes: xyz
gcode:
    {% set home_current = 0.49 %}    # A/B current while homing X/Y (Voron guide)
    {% set backoff = 10 %}           # mm to back off the frame after X/Y homing
    {% set z_hop = 10 %}             # mm
    {% set home_x = 175 %}           # Z homes here (bed centre, matches
    {% set home_y = 175 %}           # bed_mesh zero_reference_position)

    {% set th = printer.toolhead %}
    {% set cfg = printer.configfile.settings %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set do_x = home_all or 'X' in params %}
    {% set do_y = home_all or 'Y' in params %}
    {% set do_z = home_all or 'Z' in params %}

    {% if do_z and ((not do_x and 'x' not in th.homed_axes) or (not do_y and 'y' not in th.homed_axes)) %}
        {action_raise_error("G28 Z: home X and Y first.")}
    {% endif %}

    SAVE_GCODE_STATE NAME=_HOMING
    G90

    ## Lift Z first. If Z isn't homed its height is unknown, so treat it
    ## as 0, lift 10 mm, then mark it unhomed again (what safe_z_home did).
    {% if 'z' not in th.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G0 Z{z_hop} F900
        SET_KINEMATIC_POSITION CLEAR_HOMED=Z
    {% elif th.position.z < z_hop %}
        G0 Z{z_hop} F900
    {% endif %}

    {% if do_x or do_y %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}
        {% if do_x %}
            G4 P2000
            G28 X
            G0 X{cfg.stepper_x.position_endstop - backoff} F1200
        {% endif %}
        {% if do_y %}
            G4 P2000
            G28 Y
            G0 Y{cfg.stepper_y.position_endstop - backoff} F1200
        {% endif %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg['tmc2209 stepper_x'].run_current}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg['tmc2209 stepper_y'].run_current}
    {% endif %}

    {% if do_z %}
        G0 X{home_x} Y{home_y} F9000
        G28 Z
        G0 Z{z_hop} F900
    {% endif %}

    RESTORE_GCODE_STATE NAME=_HOMING


#####################################################################
#   Quad gantry level
#####################################################################

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
## Probe points (nozzle positions; the probe lands at point + offset)
points:
   50,25
   50,275
   300,275
   300,25
speed: 300
horizontal_move_z: 10     # rough pass height; a racked gantry may be far off
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

## Two-stage QGL. Replaces the built-in command, so PRINT_START, G32 and
## the QGL buttons in Mainsail and KlipperScreen all use it.
##  1. Rough pass at 10 mm until the corners are within 1 mm. Skipped if
##     the gantry is still level from the last QGL (Klipper clears that
##     flag whenever the motors turn off).
##  2. Fine pass at 2.5 mm to the 0.0075 tolerance. Cartographer reads
##     the distance at that height without moving Z, so it is quick.
## The head lifts first, then moves to the first point, so it never
## drops to 2.5 mm somewhere random. Between points it travels at
## 2.5 mm, so the bed must be clear of parts.
## With any parameters (e.g. QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=5) it
## runs the built-in command unchanged.
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Two-stage QGL: rough pass at 10 mm (if needed), fine pass at 2.5 mm
variable_rough_z: 10.0
variable_fine_z: 2.5      # must stay above 2.0, Cartographer's scan trigger height
gcode:
    {% if rawparams|trim|length > 0 %}
        _QUAD_GANTRY_LEVEL {rawparams}
    {% else %}
        {% set th = printer.toolhead %}
        {% if th.homed_axes != "xyz" %}
            {action_raise_error("QGL: home all axes first.")}
        {% endif %}
        {% set p0 = printer.configfile.settings.quad_gantry_level.points[0] %}
        SAVE_GCODE_STATE NAME=STATE_QGL
        G90
        G0 Z{[th.position.z, rough_z]|max} F900      ; straight up first if low
        G0 X{p0[0]} Y{p0[1]} F18000                  ; then to the first probe point
        {% if printer.quad_gantry_level.applied %}
            RESPOND MSG="QGL: gantry still level since the last QGL, fine pass only."
        {% else %}
            _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1 HORIZONTAL_MOVE_Z={rough_z}
        {% endif %}
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z={fine_z}
        G0 Z{rough_z} F900                           ; lift clear when done
        RESTORE_GCODE_STATE NAME=STATE_QGL
    {% endif %}


#####################################################################
#   Bed mesh (Cartographer's recommended scan setup)
#####################################################################

[bed_mesh]
zero_reference_position: 175, 175   # bed centre
speed: 300
horizontal_move_z: 3
mesh_min: 30, 30      # probe coordinates; safe for offsets up to about 30 mm
mesh_max: 320, 320
probe_count: 20, 20
mesh_pps: 0, 0        # no interpolation needed with dense scan data
adaptive_margin: 5


#####################################################################
#   Accelerometer
#####################################################################
## Cartographer V4 onboard ADXL345. V4 uses PA0. The wrong cs_pin
## (PA3 is for V3) puts the probe in an endless bootloop.

[adxl345]
cs_pin: cartographer:PA0
spi_bus: spi1
axes_map: y, -x, z    # verify with ACCELEROMETER_QUERY for your mount before input shaping

## Alternative: the Gen2's onboard LIS2DW. Use one accelerometer, not both.
#[lis2dw]
#cs_pin: EBBCan:PB1
#spi_bus: spi2_PB2_PB11_PB10

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

#####################################################################
#   Macros - Voron 2.4 350, A4T + EBB36 Gen2 + Cartographer V4
#####################################################################
##
##  Slicer start G-code (one line):
##    PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer] SOAK=0
##  SOAK=<minutes> is optional. Left out, it soaks 10 min when the bed is
##  90C or hotter (ABS/ASA/nylon) and skips the soak otherwise.
##  Enable "Label objects" in the slicer so the adaptive mesh and the
##  KAMP purge work.
##
##  Slicer end G-code:   PRINT_END
##  Filament change:     M600 (or CHANGE_FILAMENT)


#####################################################################
#   Mainsail PAUSE / RESUME / CANCEL settings
#####################################################################
## mainsail.cfg reads these. Parks rear-centre, keeps heaters on for
## up to 1 h while paused, and refuses RESUME with no filament loaded.

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 175.0
variable_custom_park_y    : 340.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 300.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 3600
variable_runout_sensor    : "filament_switch_sensor filament_sensor"
variable_user_pause_macro : "_STATUS_ALERT"
variable_user_resume_macro: "_STATUS_PRINTING"
variable_user_cancel_macro: "_AFTER_PRINT"
gcode:


#####################################################################
#   After-print housekeeping
#####################################################################
## Runs at the end of PRINT_END and on CANCEL_PRINT.

[gcode_macro _AFTER_PRINT]
gcode:
    {% set nm = printer["gcode_macro _NEVERMORE"] %}
    BED_MESH_CLEAR
    _STATUS_READY
    # Keep the Nevermore filtering for a while, then turn it off
    {% if printer["fan_generic nevermore"].speed > 0 %}
        {% if nm.run_after > 0 %}
            UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION={nm.run_after}
        {% else %}
            SET_FAN_SPEED FAN=nevermore SPEED=0
        {% endif %}
    {% endif %}


#####################################################################
#   Nevermore filter (hot prints only)
#####################################################################
## PRINT_START turns it on when the bed target is min_bed or hotter.
## _AFTER_PRINT (end of print or cancel) leaves it running for run_after
## seconds, then this delayed_gcode turns it off. Starting another hot
## print in that time cancels the turn-off.

[gcode_macro _NEVERMORE]
variable_min_bed: 90          ; bed temperature (C) that counts as a hot print
variable_speed: 1.0           ; fan speed while printing (0.0 to 1.0)
variable_run_after: 600       ; seconds it keeps running after the print (0 = off at once)
gcode:

[delayed_gcode _NEVERMORE_OFF]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0


#####################################################################
#   Homing helpers
#####################################################################

[gcode_macro _HOME_IF_NEEDED]
description: Home all axes only if they are not already homed
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

#####################################################################
#   Guards
#####################################################################
## Mainsail and KlipperScreen send macros to the printer even during a
## print, and Klipper runs them between print moves. These stop a
## mistaken tap from moving the head into a part or changing the hotend
## temperature mid-print. A refused macro only shows an error; the
## print carries on.

[gcode_macro _CHECK_IDLE]
description: Error if a print is running or paused
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] or printer.pause_resume.is_paused %}
        {action_raise_error("Not allowed while a print is running or paused.")}
    {% endif %}

## Load and unload must still work while paused (M600 and runouts)
[gcode_macro _CHECK_NOT_PRINTING]
description: Error if a print is actively running (paused is allowed)
gcode:
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        {action_raise_error("Not allowed while printing. Pause first, or use M600.")}
    {% endif %}


## The QGL fine pass travels at 2.5 mm, so the bed must be clear of parts.
[gcode_macro G32]
description: Home, quad gantry level, re-home Z, park at bed centre (bed must be clear)
gcode:
    {% set cx = printer.toolhead.axis_maximum.x / 2 %}
    {% set cy = printer.toolhead.axis_maximum.y / 2 %}
    _CHECK_IDLE
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    _HOME_IF_NEEDED
    _STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28 Z
    G0 X{cx} Y{cy} Z30 F18000
    _STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_G32


#####################################################################
#   Nozzle wipe - Cartographer silicone brush at the rear of the bed
#####################################################################
## Cartographer says touch needs a clean nozzle and recommends their
## silicone brush. PRINT_START calls this at 140-150C, right before
## CARTOGRAPHER_TOUCH_HOME.
##
## OFF until measured. To set it up, with the printer homed and QGL'd:
##   1. Jog the nozzle over the left end of the brush: note X  -> brush_x_min
##   2. Jog to the right end: note X                          -> brush_x_max
##   3. Note Y with the nozzle over the brush centre line      -> brush_y
##   4. Lower Z until the nozzle tip is about 1 mm into the
##      bristles: note Z                                       -> brush_z
##   5. Check the Cartographer body clears the bristles at that Z.
##      The coil sits only about 2.6-3 mm above the nozzle tip.
##   6. Set enabled: True
## Wipes run along X only, so the brush should run left-right.

[gcode_macro _NOZZLE_WIPE]
description: Wipe the nozzle across the rear brush (off until measured)
variable_enabled: False
variable_brush_x_min: 0.0     ; nozzle X at the left end of the brush
variable_brush_x_max: 0.0     ; nozzle X at the right end
variable_brush_y: 0.0         ; nozzle Y over the brush centre line
variable_brush_z: 0.0         ; nozzle Z with the tip ~1 mm into the bristles
variable_wipes: 4             ; back-and-forth passes
variable_wipe_speed: 150      ; mm/s
variable_clearance: 10        ; travel height above brush_z (mm)
gcode:
    {% set th = printer.toolhead %}
    {% if not enabled %}
        RESPOND MSG="Nozzle wipe skipped: brush position not set yet (see _NOZZLE_WIPE in macros.cfg)."
    {% else %}
        {% if th.homed_axes != "xyz" %}
            {action_raise_error("Nozzle wipe: home all axes first.")}
        {% endif %}
        {% if brush_x_min >= brush_x_max
              or brush_x_min < th.axis_minimum.x or brush_x_max > th.axis_maximum.x
              or brush_y < th.axis_minimum.y or brush_y > th.axis_maximum.y
              or brush_z < th.axis_minimum.z or brush_z + clearance > th.axis_maximum.z %}
            {action_raise_error("Nozzle wipe: brush position is outside the axis limits. Check the _NOZZLE_WIPE values.")}
        {% endif %}
        {% set z_travel = [th.position.z, brush_z + clearance]|max %}
        SAVE_GCODE_STATE NAME=STATE_WIPE
        G90
        G0 Z{z_travel} F900                     ; lift before travelling
        G0 X{brush_x_min} Y{brush_y} F12000
        G0 Z{brush_z} F600
        {% for i in range(wipes) %}
            G1 X{brush_x_max} F{wipe_speed * 60}
            G1 X{brush_x_min} F{wipe_speed * 60}
        {% endfor %}
        G0 Z{brush_z + clearance} F600
        RESTORE_GCODE_STATE NAME=STATE_WIPE
    {% endif %}


#####################################################################
#   PRINT_START
#####################################################################
## Order follows Cartographer's PRINT_START template:
## home (scan) -> heat bed -> QGL -> nozzle at touch temp -> brush wipe ->
## CARTOGRAPHER_TOUCH_HOME -> adaptive mesh -> print temp -> purge.
## The last two use KAMP: heat next to the print, then purge in front of it.
##
## Touch is refused above 150C (Cartographer default), so the nozzle
## is held at 145C and only touches once it reads 140-150C. That also
## covers starting a print while the nozzle is still hot.

[gcode_macro PRINT_START]
description: Home, level, touch-home Z, adaptive mesh, heat, purge
## Reset first, then the main sequence. The reset has to run in its own
## step: the body's filament check is evaluated before any of its
## commands run, so the sensor must already be back on by then.
gcode:
    _PRINT_RESET
    _PRINT_START_BODY {rawparams}

## Puts the printer in a known state before every print, whatever an
## earlier macro left behind if it stopped partway through:
##  - arc plane back to XY (a failed XZ demo circle would otherwise make
##    the next print's G2/G3 arcs swing in Z)
##  - speed and accel back to the printer.cfg values (the demo caps them)
##  - runout sensor on (UNLOAD and COLD_PULL switch it off while moving)
##  - load prompt un-silenced (COLD_PULL silences it)
##  - any open pop-up closed, so an old button can't be tapped mid-print
## If you ever disable the runout sensor on purpose, this turns it back on.
[gcode_macro _PRINT_RESET]
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    RESPOND TYPE=command MSG=action:prompt_end
    G17
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SET_GCODE_VARIABLE MACRO=_FILAMENT_INSERTED VARIABLE=suppress VALUE=0

[gcode_macro _PRINT_START_BODY]
gcode:
    {% set bed        = params.BED|default(60)|int %}
    {% set hotend     = params.EXTRUDER|default(200)|int %}
    {% set soak_min   = params.SOAK|default(10 if bed >= 90 else 0)|int %}
    {% set touch_temp = 145 %}
    {% set cx = printer.toolhead.axis_maximum.x / 2 %}
    {% set cy = printer.toolhead.axis_maximum.y / 2 %}
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% set has_objects = printer.exclude_object.objects|length > 0 %}

    # Stop before heating anything if the extruder is empty
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("No filament in the extruder. Load filament, then start the print again.")}
    {% endif %}

    CLEAR_PAUSE
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    SET_PIN PIN=caselight VALUE=0.52

    # Nevermore on for hot prints (ABS/ASA/nylon), see _NEVERMORE
    {% set nm = printer["gcode_macro _NEVERMORE"] %}
    {% if bed >= nm.min_bed %}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION=0
        SET_FAN_SPEED FAN=nevermore SPEED={nm.speed}
    {% endif %}

    # Home with scan
    _STATUS_HOMING
    SET_DISPLAY_TEXT MSG="Homing"
    G90
    G28

    # Heat bed; soften leftover filament on the nozzle at the same time
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Bed: {bed}C"
    M104 S{touch_temp}
    G0 X{cx} Y{cy} Z20 F18000
    M190 S{bed}

    {% if soak_min > 0 %}
        SET_DISPLAY_TEXT MSG="Heat soak: {soak_min} min"
        M106 S255                        ; stir chamber air
        G4 P{soak_min * 60000}
        M107
    {% endif %}

    # Level the gantry with scan, now that the frame is warm
    _STATUS_LEVELING
    SET_DISPLAY_TEXT MSG="QGL"
    QUAD_GANTRY_LEVEL

    # True Z0 with touch, nozzle between 140 and 150C
    SET_DISPLAY_TEXT MSG="Touch home"
    M104 S{touch_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={touch_temp - 5} MAXIMUM=150
    _NOZZLE_WIPE                         ; skips itself until the brush is measured
    G0 X{cx} Y{cy} Z10 F18000
    CARTOGRAPHER_TOUCH_HOME

    # Adaptive scan mesh over the printed area only
    _STATUS_MESHING
    SET_DISPLAY_TEXT MSG="Bed mesh"
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Heat to print temperature next to the print (KAMP smart park).
    # Without labelled objects, heat at the front-edge purge start instead.
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Hotend: {hotend}C"
    {% if has_objects %}
        SMART_PARK
    {% else %}
        G0 X{cx - 50} Y4 Z10 F18000
    {% endif %}
    M107
    M109 S{hotend}

    # Purge just in front of the print (KAMP), or along the front edge
    SET_DISPLAY_TEXT MSG="Purging"
    {% if has_objects %}
        LINE_PURGE
    {% else %}
        RESPOND MSG="No labelled objects in this file: using the front-edge purge. Turn on Label objects in the slicer for KAMP purge and the adaptive mesh."
        G0 Z0.4 F600
        G92 E0
        G1 X{cx + 50} E20 F1000
        G1 X{cx + 60} F6000              ; short wipe
        G92 E0
        G0 Z2 F600
    {% endif %}

    _STATUS_PRINTING
    SET_DISPLAY_TEXT MSG="Printing"


#####################################################################
#   PRINT_END
#####################################################################

[gcode_macro PRINT_END]
description: Retract, heaters off, park rear-centre
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    {% set z_park = [th.position.z + 10, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                                     ; wait for moves to finish
    G92 E0
    G1 E-5.0 F1800                           ; retract
    TURN_OFF_HEATERS
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; pull away from the part
    G0 Z{z_park} F600
    G0 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y - 2} F3600
    M107
    _AFTER_PRINT
    SET_DISPLAY_TEXT MSG="Print done"
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


#####################################################################
#   Materials - one list for every material pop-up
#####################################################################
## The load, PID and cold pull pop-ups all build their buttons from
## this list, so a temperature only needs changing here.
##   hotend: load, hotend PID and cold pull heat temperature
##   bed:    bed PID temperature. 0 = cleaning filament (cold pull only)
##   pull:   cold pull temperature. 0 = not offered for cold pulls
## Buttons appear in this order, two per row. Materials that share a bed
## temperature share one bed PID button.

[gcode_macro _MATERIALS]
variable_materials: [
    {"name": "PLA",      "hotend": 210, "bed": 60,  "pull": 90},
    {"name": "PETG",     "hotend": 240, "bed": 80,  "pull": 120},
    {"name": "ABS/ASA",  "hotend": 250, "bed": 100, "pull": 0},
    {"name": "Nylon",    "hotend": 260, "bed": 90,  "pull": 140},
    {"name": "PC",       "hotend": 270, "bed": 110, "pull": 0},
    {"name": "Nylon-CF", "hotend": 280, "bed": 90,  "pull": 0},
    {"name": "Cleaning", "hotend": 250, "bed": 0,   "pull": 120}
    ]
gcode:


#####################################################################
#   Filament handling (uses the runout sensor in the WW-BMG)
#####################################################################
## LOAD and UNLOAD restore the previous extrusion mode. The old
## versions always ended with M82, which switched a slicer running
## relative extrusion (M83) into absolute mode after a mid-print
## filament change.
##
## The sensor sits inside the extruder, so it can tell whether the
## gears have filament. That lets the macros:
##   - refuse to LOAD with nothing inserted, and refuse a print start
##     with an empty extruder (in PRINT_START)
##   - confirm an UNLOAD actually cleared the extruder
##   - auto-load when you push filament in during a runout or M600 pause
##   - offer a one-tap "heat and load" prompt when you insert filament
##     while the printer is idle

[gcode_macro _FILAMENT_PRESENT]
description: Error if the runout sensor sees no filament (sensor disabled = skip)
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("No filament detected at the extruder. Insert filament first.")}
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load and prime filament (nozzle must be hot, filament inserted)
gcode:
    _CHECK_NOT_PRINTING
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle too cold to load. Heat it first.")}
    {% endif %}
    _FILAMENT_PRESENT
    SAVE_GCODE_STATE NAME=STATE_LOAD
    M83
    G1 E100 F300                     ; load
    G1 E15 F150                      ; prime
    RESTORE_GCODE_STATE NAME=STATE_LOAD

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (nozzle must be hot), then confirm it cleared
gcode:
    _CHECK_NOT_PRINTING
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle too cold to unload. Heat it first.")}
    {% endif %}
    # Klipper treats filament leaving the sensor during extruder moves as
    # a runout, so the sensor is off while unloading. Otherwise every
    # unload would trigger a second pause and a second unload.
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SAVE_GCODE_STATE NAME=STATE_UNLOAD
    M83
    G1 E10 F300                      ; soften the tip
    G1 E-120 F1800                   ; pull out
    M400
    RESTORE_GCODE_STATE NAME=STATE_UNLOAD
    G4 P500                          ; let the sensor settle
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    _CHECK_UNLOADED

## Separate macro so the sensor is read after the retract, not before
[gcode_macro _CHECK_UNLOADED]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% if sensor.enabled and sensor.filament_detected %}
        RESPOND TYPE=error MSG="Unload finished but the sensor still sees filament. Pull it out by hand."
    {% else %}
        RESPOND MSG="Filament unloaded."
    {% endif %}

## Runs after the runout sensor has already paused the print.
## The Mainsail PAUSE has parked the head with the heaters still on.
[gcode_macro _RUNOUT_UNLOAD]
gcode:
    SET_DISPLAY_TEXT MSG="Runout: unloading"
    UNLOAD_FILAMENT
    SET_DISPLAY_TEXT MSG="Insert filament to auto-load"
    RESPOND TYPE=error MSG="Filament runout. Push new filament into the extruder; it loads automatically. Clear the purge, then RESUME."

## Sensor insert_gcode. Klipper only runs it when not printing, so it
## fires while paused or idle, never mid-print.
[gcode_macro _FILAMENT_INSERTED]
variable_suppress: 0      ; set by COLD_PULL so re-inserting between pulls stays quiet
gcode:
    {% if suppress %}
        RESPOND MSG="Filament detected."
    {% elif printer.pause_resume.is_paused %}
        {% if printer.extruder.can_extrude %}
            SET_DISPLAY_TEXT MSG="Loading filament"
            LOAD_FILAMENT
            SET_DISPLAY_TEXT MSG="Clear the purge, then RESUME"
            RESPOND MSG="Filament loaded. Clear the purge blob, then press RESUME."
        {% else %}
            RESPOND TYPE=error MSG="Filament detected, but the nozzle is cold. Heat it, run LOAD_FILAMENT, then RESUME."
        {% endif %}
    {% elif printer.print_stats.state != "printing" %}
        _LOAD_PROMPT
    {% endif %}

## Pop-up (KlipperScreen and Mainsail) with one-tap heat-and-load
## buttons, one per print material in _MATERIALS
[gcode_macro _LOAD_PROMPT]
gcode:
    {% set mats = [] %}
    {% for m in printer["gcode_macro _MATERIALS"].materials %}
        {% if m.bed > 0 %}{% set _ = mats.append(m) %}{% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Filament detected"
    RESPOND TYPE=command MSG="action:prompt_text Heat the nozzle and load it?"
    {% for row in mats|batch(2) %}
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for m in row %}
            RESPOND TYPE=command MSG="action:prompt_button {m.name} {m.hotend}|_HEAT_AND_LOAD TEMP={m.hotend}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _HEAT_AND_LOAD]
description: Heat, load, then turn the heater back off
gcode:
    {% set t = params.TEMP|default(220)|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    _STATUS_HEATING
    M109 S{t}
    _LOAD_IF_PRESENT                 ; never errors, so the heater-off below always runs
    M104 S0
    _STATUS_READY

## Re-checks the sensor after heating. If the filament was pulled out
## while heating, it skips the load instead of erroring, so
## _HEAT_AND_LOAD can still switch the heater off.
[gcode_macro _LOAD_IF_PRESENT]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% if sensor.enabled and not sensor.filament_detected %}
        RESPOND TYPE=error MSG="Filament was removed while heating. Load cancelled, heater off."
    {% else %}
        LOAD_FILAMENT
    {% endif %}

[gcode_macro M600]
description: Filament change: pause, park, unload, auto-load on insert, RESUME
gcode:
    PAUSE
    UNLOAD_FILAMENT
    SET_DISPLAY_TEXT MSG="Insert filament to auto-load"
    RESPOND MSG="Push new filament into the extruder; it loads automatically. Clear the purge, then RESUME."

[gcode_macro CHANGE_FILAMENT]
description: Same as M600
gcode:
    M600

#####################################################################
#   Nozzle change - Dragon UHF (hot-tighten)
#####################################################################
## The Revo swapped nozzles cold. The Dragon's nozzle seals against the
## heatbreak and must be tightened hot (285C, Phaetus' hot-tighten
## temperature) or it leaks at print temperature. Bondtech rates the
## CHT BiMetal's copper body for about 1.5 Nm, so do not over-torque.
## Override at call: NOZZLE_CHANGE TEMP=285 FAN_TIME=180

[gcode_macro NOZZLE_CHANGE]
description: Heat to 285C, unload, swap and hot-tighten the nozzle, then cool
variable_temp: 285
variable_fan_time: 120
gcode:
    {% set t      = params.TEMP|default(printer["gcode_macro NOZZLE_CHANGE"].temp)|int %}
    {% set cool   = params.FAN_TIME|default(printer["gcode_macro NOZZLE_CHANGE"].fan_time)|int %}
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}

    _CHECK_IDLE
    {% set z_lift = [printer.toolhead.position.z, 220]|max %}
    G90
    _HOME_IF_NEEDED
    G0 Z{z_lift} F900                ; straight up first, never down across the bed
    G0 X175 Y15 F12000               ; then front-centre for access

    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Heating to {t}C"
    M109 S{t}
    G4 S90                           ; let the whole heater block reach temperature

    {% if not sensor.enabled or sensor.filament_detected %}
        UNLOAD_FILAMENT
    {% endif %}

    _STATUS_ALERT
    SET_DISPLAY_TEXT MSG="Swap nozzle, then press Done"
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle change"
    RESPOND TYPE=command MSG="action:prompt_text Hotend is at {t}C. Hold the heater block with a wrench and remove the old nozzle."
    RESPOND TYPE=command MSG="action:prompt_text Install the new nozzle and hot-tighten to about 1.5 Nm. Do not over-torque the CHT BiMetal."
    RESPOND TYPE=command MSG="action:prompt_text If the nozzle size changed, update nozzle_diameter in printer.cfg."
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_NOZZLE_CHANGE_DONE FAN_TIME={cool}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _NOZZLE_CHANGE_DONE]
gcode:
    {% set cool = params.FAN_TIME|default(120)|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE                      ; an old Done button must not turn the heater off mid-print
    M104 S0
    SET_DISPLAY_TEXT MSG="Cooling"
    M106 S255
    G4 S{cool}
    M107
    _STATUS_READY
    SET_DISPLAY_TEXT MSG="Nozzle change done"
    RESPOND MSG="Nozzle change done. PRINT_START touch-homes the new nozzle, so the Z offset does not need redoing."


#####################################################################
#   PID tuning helpers
#####################################################################
## PID_HOTEND / PID_BED open a pop-up of material buttons (KlipperScreen
## and Mainsail both show it). TEMP= skips the pop-up.
## The hotend tunes with the part fan at 25% to match low-fan nylon/PET
## printing. When done, a pop-up offers SAVE_CONFIG (restarts Klipper).

[gcode_macro PID_HOTEND]
description: Pick a temperature and PID-tune the hotend
gcode:
    _CHECK_IDLE
    {% if params.TEMP is defined %}
        _PID_HOTEND_RUN TEMP={params.TEMP|int}
    {% else %}
        {% set mats = [] %}
        {% for m in printer["gcode_macro _MATERIALS"].materials %}
            {% if m.bed > 0 %}{% set _ = mats.append(m) %}{% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID tune"
        RESPOND TYPE=command MSG="action:prompt_text Bed must be clear: the nozzle moves to 10 mm above the bed centre for the tune."
        RESPOND TYPE=command MSG="action:prompt_text Pick the temperature you print at most."
        {% for row in mats|batch(2) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for m in row %}
                RESPOND TYPE=command MSG="action:prompt_button {m.name} {m.hotend}|_PID_HOTEND_RUN TEMP={m.hotend}|primary"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _PID_HOTEND_RUN]
gcode:
    {% set t    = params.TEMP|int %}
    {% set tmax = printer.configfile.settings.extruder.max_temp|float %}
    {% set cx   = printer.toolhead.axis_maximum.x / 2 %}
    {% set cy   = printer.toolhead.axis_maximum.y / 2 %}
    {% if t > tmax - 15 %}
        {action_raise_error("PID target too close to max_temp. The tune overshoots and would trip a shutdown.")}
    {% endif %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    G90
    _HOME_IF_NEEDED
    G0 X{cx} Y{cy} Z10 F18000        ; over the bed so the fan airflow is realistic
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="PID hotend {t}C"
    M106 S64                         ; part fan 25%
    PID_CALIBRATE HEATER=extruder TARGET={t}
    M107
    _STATUS_READY
    _PID_SAVE_PROMPT

[gcode_macro PID_BED]
description: Pick a temperature and PID-tune the bed
gcode:
    _CHECK_IDLE
    {% if params.TEMP is defined %}
        _PID_BED_RUN TEMP={params.TEMP|int}
    {% else %}
        {% set mats  = printer["gcode_macro _MATERIALS"].materials %}
        {% set temps = [] %}
        {% for m in mats %}
            {% if m.bed > 0 and m.bed not in temps %}{% set _ = temps.append(m.bed) %}{% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin Bed PID tune"
        RESPOND TYPE=command MSG="action:prompt_text Pick the bed temperature you use most."
        {% for row in temps|sort|batch(2) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for t in row %}
                {% set names = [] %}
                {% for m in mats %}
                    {% if m.bed == t %}{% set _ = names.append(m.name) %}{% endif %}
                {% endfor %}
                RESPOND TYPE=command MSG="action:prompt_button {names|join('/')} {t}|_PID_BED_RUN TEMP={t}|primary"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _PID_BED_RUN]
gcode:
    {% set t    = params.TEMP|int %}
    {% set tmax = printer.configfile.settings.heater_bed.max_temp|float %}
    {% if t > tmax - 5 %}
        {action_raise_error("PID target too close to the bed max_temp.")}
    {% endif %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="PID bed {t}C"
    PID_CALIBRATE HEATER=heater_bed TARGET={t}
    _STATUS_READY
    _PID_SAVE_PROMPT

[gcode_macro _PID_SAVE_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin PID tune finished"
    RESPOND TYPE=command MSG="action:prompt_text Save the new values? SAVE_CONFIG restarts Klipper."
    RESPOND TYPE=command MSG="action:prompt_footer_button Save|_PID_SAVE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Not now|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

## SAVE_CONFIG restarts Klipper, so an old Save button must not run mid-print
[gcode_macro _PID_SAVE]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    SAVE_CONFIG


#####################################################################
#   Cold pull
#####################################################################
## Heats, packs the nozzle, cools to the pull temperature with the part
## fan, then the extruder pulls the filament out sharply.
## The pull happens below min_extrude_temp (170C), which normal G1 moves
## refuse, so it uses FORCE_MOVE ([force_move] is enabled in printer.cfg).
## Manual use: COLD_PULL HEAT=260 PULL=140

[gcode_macro COLD_PULL]
description: Pick a material and do a cold pull
gcode:
    _CHECK_IDLE
    {% if params.HEAT is defined and params.PULL is defined %}
        _COLD_PULL_RUN HEAT={params.HEAT|int} PULL={params.PULL|int}
    {% else %}
        {% set mats = [] %}
        {% for m in printer["gcode_macro _MATERIALS"].materials %}
            {% if m.pull > 0 %}{% set _ = mats.append(m) %}{% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin Cold pull"
        RESPOND TYPE=command MSG="action:prompt_text Load the cleaning filament first. Heat / pull temperatures shown."
        {% for row in mats|batch(2) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for m in row %}
                RESPOND TYPE=command MSG="action:prompt_button {m.name} {m.hotend}/{m.pull}|_COLD_PULL_RUN HEAT={m.hotend} PULL={m.pull}|primary"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _COLD_PULL_RUN]
gcode:
    {% set heat = params.HEAT|int %}
    {% set pull = params.PULL|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    _FILAMENT_PRESENT
    # Re-inserting filament between pulls should not pop the load prompt
    SET_GCODE_VARIABLE MACRO=_FILAMENT_INSERTED VARIABLE=suppress VALUE=1

    {% set z_lift = [printer.toolhead.position.z, 100]|max %}
    G90
    _HOME_IF_NEEDED
    G0 Z{z_lift} F900                ; straight up first, never down across the bed
    G0 X175 Y15 F12000               ; then front-centre

    # Heat and pack the nozzle with fresh filament
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Cold pull: heating {heat}C"
    M109 S{heat}
    SAVE_GCODE_STATE NAME=STATE_COLD_PULL
    M83
    G1 E20 F150
    M400
    RESTORE_GCODE_STATE NAME=STATE_COLD_PULL

    # Cool to the pull temperature
    SET_DISPLAY_TEXT MSG="Cold pull: cooling to {pull}C"
    M104 S0
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={pull}
    M107

    # Sensor off so the pull is not treated as a runout
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SET_DISPLAY_TEXT MSG="Cold pull: pulling"
    FORCE_MOVE STEPPER=extruder DISTANCE=-100 VELOCITY=30 ACCEL=1000
    G4 P500
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

    _STATUS_READY
    SET_DISPLAY_TEXT MSG="Cold pull done"
    RESPOND TYPE=command MSG="action:prompt_begin Cold pull done"
    RESPOND TYPE=command MSG="action:prompt_text Check the tip. It is clean when it comes out shaped like the nozzle with no dark specks."
    RESPOND TYPE=command MSG="action:prompt_text To repeat: cut off the pulled tip, push the filament back into the extruder, then press Repeat."
    RESPOND TYPE=command MSG="action:prompt_footer_button Repeat|_COLD_PULL_RUN HEAT={heat} PULL={pull}|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_COLD_PULL_DONE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _COLD_PULL_DONE]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    SET_GCODE_VARIABLE MACRO=_FILAMENT_INSERTED VARIABLE=suppress VALUE=0


#####################################################################
#   Config backup (klipper-backup)
#####################################################################

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

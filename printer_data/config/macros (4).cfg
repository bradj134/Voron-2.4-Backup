#####################################################################
#   Macros - Voron 2.4 350, A4T + EBB36 Gen2 + Cartographer V4
#####################################################################
##
##  Slicer start G-code (one line):
##    PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer]
##  Optional extras:
##    CHAMBER=<C>    chamber target for the heat soak. Left out, it is
##                   _CHAMBER_SOAK's target when the bed is 90C or hotter
##                   (ABS/ASA/nylon), and no soak otherwise. CHAMBER=0
##                   skips the soak.
##    SOAK_MAX=<min> give up waiting for the chamber after this long and
##                   print anyway (default in _CHAMBER_SOAK).
##    SOAK=<min>     fixed-time soak instead, only used when there is no
##                   chamber target (e.g. CHAMBER=0 SOAK=5).
##  Enable "Label objects" in the slicer so the adaptive mesh and the
##  KAMP purge work.
##
##  Slicer end G-code:   PRINT_END
##  Filament change:     M600 (or CHANGE_FILAMENT)


#####################################################################
#   Mainsail PAUSE / RESUME / CANCEL settings
#####################################################################
## mainsail.cfg reads these. Parks rear-centre, keeps heaters on for
## up to 1 h while paused, and refuses RESUME with no filament loaded.

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 175.0
variable_custom_park_y    : 340.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 30.0
variable_speed_move       : 300.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 3600
variable_runout_sensor    : "filament_switch_sensor filament_sensor"
variable_user_pause_macro : "_STATUS_ALERT"
variable_user_resume_macro: "_STATUS_PRINTING"
variable_user_cancel_macro: "_AFTER_PRINT"
gcode:


#####################################################################
#   After-print housekeeping
#####################################################################
## Runs at the end of PRINT_END and on CANCEL_PRINT.

[gcode_macro _AFTER_PRINT]
gcode:
    {% set nm = printer["gcode_macro _NEVERMORE"] %}
    BED_MESH_CLEAR
    _STATUS_READY
    # Keep the Nevermore filtering for a while, then turn it off
    {% if printer["fan_generic nevermore"].speed > 0 %}
        {% if nm.run_after > 0 %}
            UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION={nm.run_after}
        {% else %}
            SET_FAN_SPEED FAN=nevermore SPEED=0
        {% endif %}
    {% endif %}


#####################################################################
#   Nevermore filter (hot prints only)
#####################################################################
## PRINT_START turns it on when the bed target is min_bed or hotter.
## _AFTER_PRINT (end of print or cancel) leaves it running for run_after
## seconds, then this delayed_gcode turns it off. Starting another hot
## print in that time cancels the turn-off.

[gcode_macro _NEVERMORE]
variable_min_bed: 90          ; bed temperature (C) that counts as a hot print
variable_speed: 1.0           ; fan speed while printing (0.0 to 1.0)
variable_run_after: 600       ; seconds it keeps running after the print (0 = off at once)
gcode:

[delayed_gcode _NEVERMORE_OFF]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0


#####################################################################
#   Homing helpers
#####################################################################

[gcode_macro _HOME_IF_NEEDED]
description: Home all axes only if they are not already homed
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

#####################################################################
#   Guards
#####################################################################
## Mainsail and KlipperScreen send macros to the printer even during a
## print, and Klipper runs them between print moves. These stop a
## mistaken tap from moving the head into a part or changing the hotend
## temperature mid-print. A refused macro only shows an error; the
## print carries on.

[gcode_macro _CHECK_IDLE]
description: Error if a print is running or paused
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] or printer.pause_resume.is_paused %}
        {action_raise_error("Not allowed while a print is running or paused.")}
    {% endif %}

## Load and unload must still work while paused (M600 and runouts)
[gcode_macro _CHECK_NOT_PRINTING]
description: Error if a print is actively running (paused is allowed)
gcode:
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        {action_raise_error("Not allowed while printing. Pause first, or use M600.")}
    {% endif %}


## The QGL fine pass travels at 2.5 mm, so the bed must be clear of parts.
[gcode_macro G32]
description: Home, quad gantry level, re-home Z, park at bed centre (bed must be clear)
gcode:
    {% set cx = printer.toolhead.axis_maximum.x / 2 %}
    {% set cy = printer.toolhead.axis_maximum.y / 2 %}
    _CHECK_IDLE
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    _HOME_IF_NEEDED
    _STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28 Z
    G0 X{cx} Y{cy} Z30 F18000
    _STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_G32


#####################################################################
#   Nozzle scrubber - jinetix A1-pad scrubber at the rear of the bed
#####################################################################
## Adapted from jinetix's NOZZLE_CLEAN and NOZZLE_PARK_BUCKET:
## https://www.printables.com/model/796563-voron-24-silicone-nozzle-scrubber-w-sheet-stops-be
## Cartographer touch needs a clean nozzle. PRINT_START runs the clean
## at 140-150C, after QGL and G28 Z, right before CARTOGRAPHER_TOUCH_HOME.
##
## Changed from the original for this printer:
##  - one settings macro (_NOZZLE_SCRUB) instead of two copies of every value
##  - lifts to travel_z BEFORE moving, then descends over the bucket. The
##    original dropped to clean_z first and crossed the bed at 1.5 mm.
##  - Z lifts at 30 mm/s (max_z_velocity) and descends at 15 mm/s. The
##    original asked for 25 mm/s down and 150 mm/s up; Klipper silently
##    clamps anything above max_z_velocity.
##  - scrub circles are centred on each pass point. The original's G2/G3
##    with I=radius put every circle one radius to the right, so the last
##    pass ran off the right edge of the pad.
##  - G17 first, so the arcs are XY even if a demo XZ circle was cut short
##  - no surprise G28 or QGL: it refuses to run unless X, Y and Z are
##    homed (the original only checked that something was homed)
##  - every point it visits is checked against the axis limits first
##  - NOZZLE_CLEAN is blocked during a print; PRINT_START calls the
##    internal _NOZZLE_CLEAN_RUN instead
##  - OFF until the positions are measured (enabled: False)
##
## Measuring (printer homed, QGL'd and Z re-homed with G32, nozzle at 145C):
##   brush_ref_x / brush_ref_y: nozzle over the pad's rear-left corner
##   brush_width / brush_depth: pad size the nozzle can use (X / Y)
##   bucket_side / bucket_offset: which side the bucket is on, and the
##       distance from that pad edge to the bucket centre
##   clean_z: nozzle Z with the tip about 1 mm into the pad. The flicks
##       dip a further flick_z_dip below this.
## The Cartographer coil is 25.4 mm behind the nozzle and only about
## 2.6-3 mm above the tip, so check it clears everything behind the pad
## at flick depth before enabling.

[gcode_macro _NOZZLE_SCRUB]
description: Scrubber settings (used by NOZZLE_CLEAN and NOZZLE_PARK_BUCKET)
variable_enabled: True
## Position (measured 2026-11-17, after G32 at 145C)
variable_brush_ref_x: 261.0     ; nozzle X at the pad's rear-left corner
variable_brush_ref_y: 359.0     ; nozzle Y at the pad's rear-left corner
variable_brush_width: 37.0      ; usable pad length along X (mm): 261 to 298
variable_brush_depth: 6.0       ; usable pad depth along Y (mm): 359 to 353
variable_bucket_side: "right"   ; bucket is "right" or "left" of the pad
variable_bucket_offset: 18.0    ; pad edge to bucket centre (mm): bucket centre X316
variable_clean_z: 0.0           ; nozzle Z, tip 1 mm into the pad (pad top is Z1)
## Heights and speeds
variable_travel_z: 10.0         ; minimum height for moves to and from the scrubber
variable_park_z: 5.0            ; NOZZLE_PARK_BUCKET height
variable_travel_speed: 9000     ; mm/min
variable_z_speed: 900           ; mm/min (15 mm/s): moves down to the pad and bucket
variable_z_lift_speed: 1800     ; mm/min (30 mm/s, max_z_velocity): lifts
## Flicks (drag across the pad edge, snap back over the bucket)
variable_flick_count: 5
variable_flick_depth: 3.0       ; how far into the pad each flick reaches (mm)
variable_flick_z_dip: 0.5       ; extra depth below clean_z for flicks (mm)
variable_flick_dwell_ms: 20
variable_flick_speed: 9000      ; mm/min
variable_flick_return_mult: 1.5 ; return speed = flick_speed x this
## Scrub (small circles along the pad)
variable_scrub_passes: 5
variable_circles_per_pass: 2
variable_circle_radius: 2.0     ; must stay under brush_depth / 2
variable_scrub_speed: 3000      ; mm/min
variable_alternate_direction: True
## PRINT_START bucket purge (after heating to print temperature)
variable_bucket_purge: 15       ; filament pushed into the bucket (mm)
variable_bucket_purge_speed: 150 ; mm/min of filament (about 6 mm3/s)
gcode:
    {action_respond_info("_NOZZLE_SCRUB only stores settings. Run NOZZLE_CLEAN or NOZZLE_PARK_BUCKET.")}

[gcode_macro NOZZLE_CLEAN]
description: Flick and scrub the nozzle on the rear pad (heat to ~145C first)
gcode:
    _CHECK_IDLE
    _NOZZLE_CLEAN_RUN

## PRINT_START calls this directly (a print is running, so the guard in
## NOZZLE_CLEAN would refuse it)
[gcode_macro _NOZZLE_CLEAN_RUN]
gcode:
    {% set s  = printer["gcode_macro _NOZZLE_SCRUB"] %}
    {% set th = printer.toolhead %}
    {% if not s.enabled %}
        RESPOND MSG="Nozzle clean skipped: scrubber not measured yet (see _NOZZLE_SCRUB in macros.cfg)."
    {% else %}
        {% if th.homed_axes != "xyz" %}
            {action_raise_error("Nozzle clean: home and level first (G32).")}
        {% endif %}
        {% set r  = s.circle_radius %}
        {% set cy = s.brush_ref_y - s.brush_depth / 2 %}
        {% set usable = s.brush_width - 2 * r %}
        {% if s.bucket_side|lower == "right" %}
            {% set bucket_x = s.brush_ref_x + s.brush_width + s.bucket_offset %}
            {% set flick_x  = s.brush_ref_x + s.brush_width - s.flick_depth %}
        {% else %}
            {% set bucket_x = s.brush_ref_x - s.bucket_offset %}
            {% set flick_x  = s.brush_ref_x + s.flick_depth %}
        {% endif %}
        {% if s.scrub_passes > 1 %}
            {% set step = usable / (s.scrub_passes - 1) %}
        {% else %}
            {% set step = 0 %}
        {% endif %}
        {% set start_x = s.brush_ref_x + r if s.scrub_passes > 1 else s.brush_ref_x + s.brush_width / 2 %}
        {% set flick_z  = s.clean_z - s.flick_z_dip %}
        {% set z_travel = [th.position.z, s.travel_z]|max %}
        {% set xs = [bucket_x, flick_x, s.brush_ref_x, s.brush_ref_x + s.brush_width] %}
        {% if s.bucket_side|lower not in ["right", "left"] or usable <= 0 or r * 2 > s.brush_depth
              or xs|min < th.axis_minimum.x or xs|max > th.axis_maximum.x
              or cy - r < th.axis_minimum.y or cy + r > th.axis_maximum.y
              or flick_z < th.axis_minimum.z or s.clean_z >= s.travel_z or z_travel > th.axis_maximum.z %}
            {action_raise_error("Nozzle clean: scrubber settings put the nozzle outside the axis limits or are inconsistent. Check _NOZZLE_SCRUB.")}
        {% endif %}
        SAVE_GCODE_STATE NAME=STATE_SCRUB
        G90
        G17                                            ; arcs in the XY plane
        G0 Z{z_travel} F{s.z_lift_speed}               ; lift before travelling
        G0 X{bucket_x} Y{cy} F{s.travel_speed}         ; over the bucket
        G0 Z{s.clean_z} F{s.z_speed}
        ## Flicks
        {% for i in range(s.flick_count) %}
            G1 Z{flick_z} F{s.z_speed}                 ; dip
            G1 X{flick_x} F{s.flick_speed}             ; into the pad
            G4 P{s.flick_dwell_ms|int}
            G1 X{bucket_x} F{s.flick_speed * s.flick_return_mult}   ; snap back over the bucket
            G1 Z{s.clean_z} F{s.z_speed}
        {% endfor %}
        ## Scrub: each circle starts one radius left of its pass point, so
        ## I={r} centres it on the point and it stays on the pad
        {% for i in range(s.scrub_passes) %}
            {% set x_pos = start_x + i * step %}
            G1 X{x_pos - r} Y{cy} F{s.travel_speed}
            {% for j in range(s.circles_per_pass) %}
                {% if s.alternate_direction and (i + j) % 2 == 1 %}
                    G3 X{x_pos - r} Y{cy} I{r} J0 F{s.scrub_speed}
                {% else %}
                    G2 X{x_pos - r} Y{cy} I{r} J0 F{s.scrub_speed}
                {% endif %}
            {% endfor %}
        {% endfor %}
        G0 Z{z_travel} F{s.z_lift_speed}               ; straight up, clear of the scrubber walls
        RESTORE_GCODE_STATE NAME=STATE_SCRUB
    {% endif %}

## Allowed while paused (e.g. purging during M600), not mid-print
[gcode_macro NOZZLE_PARK_BUCKET]
description: Park the nozzle over the purge bucket
gcode:
    {% set s  = printer["gcode_macro _NOZZLE_SCRUB"] %}
    {% set th = printer.toolhead %}
    _CHECK_NOT_PRINTING
    {% if not s.enabled %}
        {action_raise_error("Scrubber not measured yet (see _NOZZLE_SCRUB in macros.cfg).")}
    {% endif %}
    {% if th.homed_axes != "xyz" %}
        {action_raise_error("Park over bucket: home all axes first.")}
    {% endif %}
    {% set cy = s.brush_ref_y - s.brush_depth / 2 %}
    {% if s.bucket_side|lower == "right" %}
        {% set bucket_x = s.brush_ref_x + s.brush_width + s.bucket_offset %}
    {% else %}
        {% set bucket_x = s.brush_ref_x - s.bucket_offset %}
    {% endif %}
    {% set z_travel = [th.position.z, s.travel_z]|max %}
    {% if bucket_x < th.axis_minimum.x or bucket_x > th.axis_maximum.x
          or cy < th.axis_minimum.y or cy > th.axis_maximum.y or z_travel > th.axis_maximum.z %}
        {action_raise_error("Park over bucket: position is outside the axis limits. Check _NOZZLE_SCRUB.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=STATE_PARK_BUCKET
    G90
    G0 Z{z_travel} F{s.z_lift_speed}                   ; lift before travelling
    G0 X{bucket_x} Y{cy} F{s.travel_speed}
    G0 Z{s.park_z} F{s.z_speed}
    RESTORE_GCODE_STATE NAME=STATE_PARK_BUCKET


## PRINT_START step, nozzle hot and over the bucket:
##  1. Purge bucket_purge mm: primes the nozzle and flushes the material
##     that sat at 145C through the soak, QGL, touch and mesh.
##  2. Retract KAMP's tip_distance (5 mm, same as PRINT_END's retract).
##     That relieves the nozzle pressure so it doesn't ooze on the way to
##     the print, and LINE_PURGE pushes exactly that much back before it
##     purges, so the line starts without a blob.
##  3. Hot clean: flicks drop the hanging purge into the bucket, then the
##     scrub wipes the tip (the pad is made for a hot nozzle).
[gcode_macro _BUCKET_PURGE]
gcode:
    {% set s = printer["gcode_macro _NOZZLE_SCRUB"] %}
    {% set retract = printer["gcode_macro _KAMP_Settings"].tip_distance %}
    SAVE_GCODE_STATE NAME=STATE_BUCKET_PURGE
    M83
    G1 E{s.bucket_purge} F{s.bucket_purge_speed}     ; purge into the bucket
    G1 E-{retract} F1800                             ; retract (KAMP tip_distance)
    RESTORE_GCODE_STATE NAME=STATE_BUCKET_PURGE
    _NOZZLE_CLEAN_RUN


#####################################################################
#   Chamber heat soak (chamber thermistor on T1)
#####################################################################
## PRINT_START waits for the chamber to reach a target instead of a fixed
## time. Klipper's TEMPERATURE_WAIT has no timeout, so a target the
## chamber can't reach (door open, cold room) would hang the print
## forever. Instead, PRINT_START calls _CHAMBER_SOAK_STEP repeatedly:
## each call reads the chamber fresh, waits check_seconds if it's still
## cold, and does nothing once the target is reached. After max_minutes
## the steps run out and the print starts anyway, with a warning.

[gcode_macro _CHAMBER_SOAK]
variable_min_bed: 90          ; bed temperature (C) that counts as a hot print (matches _NEVERMORE)
variable_target: 45           ; default chamber target (C) for hot prints
variable_max_minutes: 30      ; give up and print after this long
variable_check_seconds: 30    ; how often the chamber is re-checked
variable_done: 0              ; internal
gcode:

[gcode_macro _CHAMBER_SOAK_STEP]
gcode:
    {% set cs = printer["gcode_macro _CHAMBER_SOAK"] %}
    {% set t = printer["temperature_sensor chamber"].temperature %}
    {% set target = params.TARGET|float %}
    {% if not cs.done %}
        {% if t >= target %}
            SET_GCODE_VARIABLE MACRO=_CHAMBER_SOAK VARIABLE=done VALUE=1
            RESPOND MSG="Chamber {'%.1f' % t}C: target {target|int}C reached."
        {% else %}
            SET_DISPLAY_TEXT MSG="Chamber {'%.1f' % t}/{target|int}C"
            G4 P{cs.check_seconds * 1000}
        {% endif %}
    {% endif %}

[gcode_macro _CHAMBER_SOAK_RESULT]
gcode:
    {% set t = printer["temperature_sensor chamber"].temperature %}
    {% if not printer["gcode_macro _CHAMBER_SOAK"].done %}
        RESPOND TYPE=error MSG="Chamber soak timed out after {params.MAX} min at {'%.1f' % t}C (target {params.TARGET}C). Printing anyway."
    {% endif %}


#####################################################################
#   PRINT_START
#####################################################################
## Order follows Cartographer's PRINT_START template:
## home (scan) -> heat bed -> chamber soak -> QGL -> G28 Z -> nozzle at
## touch temp -> scrub -> CARTOGRAPHER_TOUCH_HOME -> adaptive mesh ->
## heat to print temp over the bucket -> bucket purge, retract, hot
## clean -> KAMP line purge in front of the print.
## Heating over the bucket keeps the heat-up ooze off the bed. If the
## scrubber is switched off, it heats at KAMP's smart park spot instead.
##
## Touch is refused above 150C (Cartographer default), so the nozzle
## is held at 145C and only touches once it reads 140-150C. That also
## covers starting a print while the nozzle is still hot.

[gcode_macro PRINT_START]
description: Home, level, touch-home Z, adaptive mesh, heat, purge
## Reset first, then the main sequence. The reset has to run in its own
## step: the body's filament check is evaluated before any of its
## commands run, so the sensor must already be back on by then.
gcode:
    _PRINT_RESET
    _PRINT_START_BODY {rawparams}

## Puts the printer in a known state before every print, whatever an
## earlier macro left behind if it stopped partway through:
##  - arc plane back to XY (a failed XZ demo circle would otherwise make
##    the next print's G2/G3 arcs swing in Z)
##  - speed and accel back to the printer.cfg values (the demo caps them)
##  - runout sensor on (UNLOAD and COLD_PULL switch it off while moving)
##  - load prompt un-silenced (COLD_PULL silences it)
##  - any open pop-up closed, so an old button can't be tapped mid-print
## If you ever disable the runout sensor on purpose, this turns it back on.
[gcode_macro _PRINT_RESET]
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    RESPOND TYPE=command MSG=action:prompt_end
    G17
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SET_GCODE_VARIABLE MACRO=_FILAMENT_INSERTED VARIABLE=suppress VALUE=0

[gcode_macro _PRINT_START_BODY]
gcode:
    {% set bed        = params.BED|default(60)|int %}
    {% set hotend     = params.EXTRUDER|default(200)|int %}
    {% set cs         = printer["gcode_macro _CHAMBER_SOAK"] %}
    {% set chamber    = params.CHAMBER|default(cs.target if bed >= cs.min_bed else 0)|int %}
    {% set soak_max   = params.SOAK_MAX|default(cs.max_minutes)|int %}
    {% set soak_min   = params.SOAK|default(0)|int %}
    {% set touch_temp = 145 %}
    {% set cx = printer.toolhead.axis_maximum.x / 2 %}
    {% set cy = printer.toolhead.axis_maximum.y / 2 %}
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% set has_objects = printer.exclude_object.objects|length > 0 %}

    # Stop before heating anything if the extruder is empty
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("No filament in the extruder. Load filament, then start the print again.")}
    {% endif %}

    CLEAR_PAUSE
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    SET_PIN PIN=caselight VALUE=0.52

    # Nevermore on for hot prints (ABS/ASA/nylon), see _NEVERMORE
    {% set nm = printer["gcode_macro _NEVERMORE"] %}
    {% if bed >= nm.min_bed %}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION=0
        SET_FAN_SPEED FAN=nevermore SPEED={nm.speed}
    {% endif %}

    # Home with scan
    _STATUS_HOMING
    SET_DISPLAY_TEXT MSG="Homing"
    G90
    G28

    # Heat bed; soften leftover filament on the nozzle at the same time
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Bed: {bed}C"
    M104 S{touch_temp}
    G0 X{cx} Y{cy} Z20 F18000
    M190 S{bed}

    # Heat soak: wait for the chamber to reach its target, but never
    # longer than soak_max minutes (see _CHAMBER_SOAK). Skipped at once
    # if the chamber is already warm from the last print.
    {% if chamber > 0 %}
        SET_DISPLAY_TEXT MSG="Chamber soak to {chamber}C"
        SET_GCODE_VARIABLE MACRO=_CHAMBER_SOAK VARIABLE=done VALUE=0
        M106 S255                        ; stir chamber air
        {% for i in range((soak_max * 60 / cs.check_seconds)|round(0, 'ceil')|int) %}
        _CHAMBER_SOAK_STEP TARGET={chamber}
        {% endfor %}
        M107
        _CHAMBER_SOAK_RESULT TARGET={chamber} MAX={soak_max}
    {% elif soak_min > 0 %}
        SET_DISPLAY_TEXT MSG="Heat soak: {soak_min} min"
        M106 S255                        ; stir chamber air
        G4 P{soak_min * 60000}
        M107
    {% endif %}

    # Level the gantry with scan, now that the frame is warm, then
    # re-home Z on the levelled gantry. QGL changes the Z reference, and
    # the scrubber's clean_z is measured after G32, which does the same.
    _STATUS_LEVELING
    SET_DISPLAY_TEXT MSG="QGL"
    QUAD_GANTRY_LEVEL
    G28 Z

    # True Z0 with touch, nozzle between 140 and 150C
    SET_DISPLAY_TEXT MSG="Touch home"
    M104 S{touch_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={touch_temp - 5} MAXIMUM=150
    _NOZZLE_CLEAN_RUN                    ; skips itself until the scrubber is measured
    G0 X{cx} Y{cy} Z10 F18000
    CARTOGRAPHER_TOUCH_HOME

    # Adaptive scan mesh over the printed area only
    _STATUS_MESHING
    SET_DISPLAY_TEXT MSG="Bed mesh"
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Heat to print temperature over the purge bucket, so the ooze from
    # the heat-up drops into the bucket instead of onto the bed. Then
    # purge, retract and clean the hot nozzle there (_BUCKET_PURGE).
    # Scrubber off: heat next to the print (KAMP smart park) as before,
    # or at the front-edge purge start without labelled objects.
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Hotend: {hotend}C"
    M107
    {% if printer["gcode_macro _NOZZLE_SCRUB"].enabled %}
        _BUCKET_MOVE
        M109 S{hotend}
        SET_DISPLAY_TEXT MSG="Purge and clean"
        _BUCKET_PURGE
    {% elif has_objects %}
        SMART_PARK
        M109 S{hotend}
    {% else %}
        G0 X{cx - 50} Y4 Z10 F18000
        M109 S{hotend}
    {% endif %}

    # Purge just in front of the print (KAMP), or along the front edge
    SET_DISPLAY_TEXT MSG="Purging"
    {% if has_objects %}
        LINE_PURGE
    {% else %}
        RESPOND MSG="No labelled objects in this file: using the front-edge purge. Turn on Label objects in the slicer for KAMP purge and the adaptive mesh."
        G0 Z10 F1800                     ; up to travel height (it may be coming from the scrubber)
        G0 X{cx - 50} Y4 F18000          ; travel to the purge start
        G0 Z0.4 F600
        G92 E0
        G1 X{cx + 50} E20 F1000
        G1 X{cx + 60} F6000              ; short wipe
        G92 E0
        G0 Z2 F1800
    {% endif %}

    _STATUS_PRINTING
    SET_DISPLAY_TEXT MSG="Printing"


#####################################################################
#   PRINT_END
#####################################################################

[gcode_macro PRINT_END]
description: Retract, heaters off, park rear-centre
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    {% set z_park = [th.position.z + 10, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                                     ; wait for moves to finish
    G92 E0
    G1 E-5.0 F1800                           ; retract
    TURN_OFF_HEATERS
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; pull away from the part
    G0 Z{z_park} F1800
    G0 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y - 2} F3600
    M107
    _AFTER_PRINT
    SET_DISPLAY_TEXT MSG="Print done"
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


#####################################################################
#   Materials - one list for every material pop-up
#####################################################################
## The load, PID and cold pull pop-ups all build their buttons from
## this list, so a temperature only needs changing here.
##   hotend: load, hotend PID and cold pull heat temperature
##   bed:    bed PID temperature. 0 = cleaning filament (cold pull only)
##   pull:   cold pull temperature. 0 = not offered for cold pulls
## Buttons appear in this order, two per row. Materials that share a bed
## temperature share one bed PID button.

[gcode_macro _MATERIALS]
variable_materials: [
    {"name": "PLA",      "hotend": 210, "bed": 60,  "pull": 90},
    {"name": "PETG",     "hotend": 240, "bed": 80,  "pull": 120},
    {"name": "ABS/ASA",  "hotend": 250, "bed": 100, "pull": 0},
    {"name": "Nylon",    "hotend": 260, "bed": 90,  "pull": 140},
    {"name": "PC",       "hotend": 270, "bed": 110, "pull": 0},
    {"name": "Nylon-CF", "hotend": 280, "bed": 90,  "pull": 0},
    {"name": "Cleaning", "hotend": 250, "bed": 0,   "pull": 120}
    ]
gcode:


#####################################################################
#   Filament handling (uses the runout sensor in the WW-BMG)
#####################################################################
## LOAD and UNLOAD restore the previous extrusion mode. The old
## versions always ended with M82, which switched a slicer running
## relative extrusion (M83) into absolute mode after a mid-print
## filament change.
##
## The sensor sits inside the extruder, so it can tell whether the
## gears have filament. That lets the macros:
##   - refuse to LOAD with nothing inserted, and refuse a print start
##     with an empty extruder (in PRINT_START)
##   - confirm an UNLOAD actually cleared the extruder
##   - grab new filament into the gears the moment it's detected, so it
##     doesn't need holding (cold-safe, see _FILAMENT_GRAB)
##   - auto-load over the purge bucket when you push filament in during a
##     runout or M600 pause (stays hot, keeps the pause height)
##   - offer a one-tap prompt when you insert filament while idle:
##     home if needed, heat over the bucket, load, heater off, scrub

## Load settings
[gcode_macro _LOAD_SETTINGS]
## grab_mm: sensor-trigger-to-gear distance plus a few mm (0 = no grab)
variable_grab_mm: 5.0          ; cold grab into the gears when filament is detected
variable_grab_speed: 5.0       ; mm/s
variable_post_load_retract: 2.0 ; retract right after the heater turns off, so it doesn't dribble after the scrub (mm, 0 = off)
variable_preheat_temp: 145     ; heat to this while homing (no ooze on the bed)
gcode:

## Pulls newly inserted filament into the drive gears. A normal G1 E move
## is refused below min_extrude_temp (170C), so this uses FORCE_MOVE
## ([force_move] is enabled in printer.cfg). That's safe here: the grab
## only moves filament from the sensor into the gears, nowhere near the
## melt zone. The idler then holds it, so you can let go.
[gcode_macro _FILAMENT_GRAB]
gcode:
    {% set ls = printer["gcode_macro _LOAD_SETTINGS"] %}
    {% if ls.grab_mm > 0 %}
        FORCE_MOVE STEPPER=extruder DISTANCE={ls.grab_mm} VELOCITY={ls.grab_speed}
    {% endif %}

## Moves over the purge bucket. Never raises an error, so a caller that
## has already turned a heater on always reaches its heater-off step.
## Skips the move (and says so) if the scrubber is off or not homed.
## KEEP_Z=1: lift only (never lower), for loads during a pause: RESUME
## returns to the print in one straight move, so the nozzle must stay at
## the pause height, above the print.
[gcode_macro _BUCKET_MOVE]
gcode:
    {% set s  = printer["gcode_macro _NOZZLE_SCRUB"] %}
    {% set th = printer.toolhead %}
    {% set keep_z = params.KEEP_Z|default(0)|int %}
    {% set cy = s.brush_ref_y - s.brush_depth / 2 %}
    {% set bucket_x = s.brush_ref_x + s.brush_width + s.bucket_offset if s.bucket_side|lower == "right" else s.brush_ref_x - s.bucket_offset %}
    {% set z_travel = [th.position.z, s.travel_z]|max %}
    {% if not s.enabled or th.homed_axes != "xyz" %}
        RESPOND MSG="Not moving to the purge bucket (scrubber off or printer not homed). Loading here."
    {% elif bucket_x < th.axis_minimum.x or bucket_x > th.axis_maximum.x or cy < th.axis_minimum.y
            or cy > th.axis_maximum.y or z_travel > th.axis_maximum.z %}
        RESPOND TYPE=error MSG="Purge bucket position is outside the axis limits (check _NOZZLE_SCRUB). Loading here."
    {% else %}
        SAVE_GCODE_STATE NAME=STATE_BUCKET
        G90
        G0 Z{z_travel} F{s.z_lift_speed}               ; lift before travelling
        G0 X{bucket_x} Y{cy} F{s.travel_speed}
        {% if not keep_z %}
            G0 Z{s.park_z} F{s.z_speed}
        {% endif %}
        RESTORE_GCODE_STATE NAME=STATE_BUCKET
    {% endif %}

[gcode_macro _FILAMENT_PRESENT]
description: Error if the runout sensor sees no filament (sensor disabled = skip)
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("No filament detected at the extruder. Insert filament first.")}
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load and prime filament (nozzle must be hot, filament inserted)
gcode:
    _CHECK_NOT_PRINTING
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle too cold to load. Heat it first.")}
    {% endif %}
    _FILAMENT_PRESENT
    SAVE_GCODE_STATE NAME=STATE_LOAD
    M83
    G1 E100 F300                     ; load
    G1 E15 F150                      ; prime
    RESTORE_GCODE_STATE NAME=STATE_LOAD

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (nozzle must be hot), then confirm it cleared
gcode:
    _CHECK_NOT_PRINTING
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle too cold to unload. Heat it first.")}
    {% endif %}
    # Klipper treats filament leaving the sensor during extruder moves as
    # a runout, so the sensor is off while unloading. Otherwise every
    # unload would trigger a second pause and a second unload.
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SAVE_GCODE_STATE NAME=STATE_UNLOAD
    M83
    G1 E10 F300                      ; soften the tip
    G1 E-120 F1800                   ; pull out
    M400
    RESTORE_GCODE_STATE NAME=STATE_UNLOAD
    G4 P500                          ; let the sensor settle
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    _CHECK_UNLOADED

## Separate macro so the sensor is read after the retract, not before
[gcode_macro _CHECK_UNLOADED]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% if sensor.enabled and sensor.filament_detected %}
        RESPOND TYPE=error MSG="Unload finished but the sensor still sees filament. Pull it out by hand."
    {% else %}
        RESPOND MSG="Filament unloaded."
    {% endif %}

## Runs after the runout sensor has already paused the print.
## The Mainsail PAUSE has parked the head with the heaters still on.
[gcode_macro _RUNOUT_UNLOAD]
gcode:
    SET_DISPLAY_TEXT MSG="Runout: unloading"
    UNLOAD_FILAMENT
    SET_DISPLAY_TEXT MSG="Insert filament to auto-load"
    RESPOND TYPE=error MSG="Filament runout. Push new filament into the extruder; it loads automatically over the purge bucket. Check the nozzle for a hanging string, then RESUME."

## Sensor insert_gcode. Klipper only runs it when not printing, so it
## fires while paused or idle, never mid-print.
[gcode_macro _FILAMENT_INSERTED]
variable_suppress: 0      ; set by COLD_PULL so re-inserting between pulls stays quiet
gcode:
    _FILAMENT_GRAB                       ; into the gears first, so you can let go
    {% if suppress %}
        RESPOND MSG="Filament detected."
    {% elif printer.pause_resume.is_paused %}
        {% if printer.extruder.can_extrude %}
            SET_DISPLAY_TEXT MSG="Loading filament"
            _BUCKET_MOVE KEEP_Z=1            ; over the bucket, at the pause height
            LOAD_FILAMENT
            SET_DISPLAY_TEXT MSG="Check for a string, then RESUME"
            RESPOND MSG="Filament loaded over the purge bucket. Check the nozzle for a hanging string, then press RESUME."
        {% else %}
            RESPOND TYPE=error MSG="Filament detected, but the nozzle is cold. Heat it, run LOAD_FILAMENT, then RESUME."
        {% endif %}
    {% elif printer.print_stats.state != "printing" %}
        _LOAD_PROMPT
    {% endif %}

## Pop-up (KlipperScreen and Mainsail) with one-tap heat-and-load
## buttons, one per print material in _MATERIALS
[gcode_macro _LOAD_PROMPT]
gcode:
    {% set mats = [] %}
    {% for m in printer["gcode_macro _MATERIALS"].materials %}
        {% if m.bed > 0 %}{% set _ = mats.append(m) %}{% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Filament detected"
    RESPOND TYPE=command MSG="action:prompt_text Filament grabbed. Pick a material to load it."
    RESPOND TYPE=command MSG="action:prompt_text Bed must be clear: it homes if needed, heats over the purge bucket, loads, then turns the heater off and scrubs."
    {% for row in mats|batch(2) %}
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for m in row %}
            RESPOND TYPE=command MSG="action:prompt_button {m.name} {m.hotend}|_HEAT_AND_LOAD TEMP={m.hotend}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

## Idle load: (not homed: preheat to 145C while homing) -> heat to load
## temperature while travelling over the bucket -> load and prime into
## the bucket -> heater off, retract 2 mm, scrub straight away (the pad
## is made for a hot nozzle).
## Two-stage heat, like PRINT_START: homing scans Z just above the bed
## centre, so the nozzle only reaches preheat_temp (no ooze) during it,
## and a homing error leaves it at 145C, not load temperature (Klipper
## can't catch the error, so idle_timeout would be what turns it off).
## Everything after the full-temperature M104 is built not to raise
## errors, so the heater-off always runs.
[gcode_macro _HEAT_AND_LOAD]
description: Home if needed, heat over the purge bucket, load, heater off, scrub
gcode:
    {% set t   = params.TEMP|default(220)|int %}
    {% set pre = [printer["gcode_macro _LOAD_SETTINGS"].preheat_temp, t]|min %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    _STATUS_HEATING
    {% if printer.toolhead.homed_axes != "xyz" %}
        SET_DISPLAY_TEXT MSG="Preheat {pre}C, homing"
        M104 S{pre}                  ; head start on heating, below ooze temperature
        G28
        _STATUS_HEATING              ; homing may have changed the LEDs
    {% endif %}
    SET_DISPLAY_TEXT MSG="Heating to {t}C"
    M104 S{t}                        ; full temperature, travel while it heats
    _BUCKET_MOVE                     ; never errors; loads in place if it can't move
    M109 S{t}
    _LOAD_IF_PRESENT                 ; never errors
    _LOAD_FINISH

## Separate macro so it reads the homed state and settings fresh, after
## the load. Over the bucket, any ooze drips in while it cools.
## Heater off the moment loading ends, then a small retract while the
## nozzle is still hot: it keeps oozing from residual pressure until it
## cools, and the retract relieves that so no fresh drip forms after the
## scrub. The next PRINT_START's bucket purge refills it. The retract is
## skipped if the nozzle is already below min_extrude_temp.
[gcode_macro _LOAD_FINISH]
gcode:
    {% set ls = printer["gcode_macro _LOAD_SETTINGS"] %}
    {% set s  = printer["gcode_macro _NOZZLE_SCRUB"] %}
    M104 S0
    {% if ls.post_load_retract > 0 and printer.extruder.can_extrude %}
        SAVE_GCODE_STATE NAME=STATE_LOAD_RETRACT
        M83
        G1 E-{ls.post_load_retract} F1800
        RESTORE_GCODE_STATE NAME=STATE_LOAD_RETRACT
    {% endif %}
    {% if s.enabled and printer.toolhead.homed_axes == "xyz" %}
        SET_DISPLAY_TEXT MSG="Scrubbing nozzle"
        _NOZZLE_CLEAN_RUN
    {% endif %}
    _STATUS_READY
    SET_DISPLAY_TEXT MSG="Filament loaded"

## Re-checks the sensor after heating. If the filament was pulled out
## while heating, it skips the load instead of erroring, so
## _HEAT_AND_LOAD can still switch the heater off.
[gcode_macro _LOAD_IF_PRESENT]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% if sensor.enabled and not sensor.filament_detected %}
        RESPOND TYPE=error MSG="Filament was removed while heating. Load cancelled, heater off."
    {% else %}
        LOAD_FILAMENT
    {% endif %}

[gcode_macro M600]
description: Filament change: pause, park, unload, auto-load on insert, RESUME
gcode:
    PAUSE
    UNLOAD_FILAMENT
    SET_DISPLAY_TEXT MSG="Insert filament to auto-load"
    RESPOND MSG="Push new filament into the extruder; it loads automatically over the purge bucket. Check the nozzle for a hanging string, then RESUME."

[gcode_macro CHANGE_FILAMENT]
description: Same as M600
gcode:
    M600

#####################################################################
#   Nozzle change - Dragon UHF (hot-tighten)
#####################################################################
## The Revo swapped nozzles cold. The Dragon's nozzle seals against the
## heatbreak and must be tightened hot (285C, Phaetus' hot-tighten
## temperature) or it leaks at print temperature. Bondtech rates the
## CHT BiMetal's copper body for about 1.5 Nm, so do not over-torque.
## Override at call: NOZZLE_CHANGE TEMP=285 FAN_TIME=180

[gcode_macro NOZZLE_CHANGE]
description: Heat to 285C, unload, swap and hot-tighten the nozzle, then cool
variable_temp: 285
variable_fan_time: 120
gcode:
    {% set t      = params.TEMP|default(printer["gcode_macro NOZZLE_CHANGE"].temp)|int %}
    {% set cool   = params.FAN_TIME|default(printer["gcode_macro NOZZLE_CHANGE"].fan_time)|int %}
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}

    _CHECK_IDLE
    {% set z_lift = [printer.toolhead.position.z, 220]|max %}
    G90
    _HOME_IF_NEEDED
    G0 Z{z_lift} F1800               ; straight up first, never down across the bed
    G0 X175 Y15 F12000               ; then front-centre for access

    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Heating to {t}C"
    M109 S{t}
    G4 S90                           ; let the whole heater block reach temperature

    {% if not sensor.enabled or sensor.filament_detected %}
        UNLOAD_FILAMENT
    {% endif %}

    _STATUS_ALERT
    SET_DISPLAY_TEXT MSG="Swap nozzle, then press Done"
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle change"
    RESPOND TYPE=command MSG="action:prompt_text Hotend is at {t}C. Hold the heater block with a wrench and remove the old nozzle."
    RESPOND TYPE=command MSG="action:prompt_text Install the new nozzle and hot-tighten to about 1.5 Nm. Do not over-torque the CHT BiMetal."
    RESPOND TYPE=command MSG="action:prompt_text If the nozzle size changed, update nozzle_diameter in printer.cfg."
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_NOZZLE_CHANGE_DONE FAN_TIME={cool}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _NOZZLE_CHANGE_DONE]
gcode:
    {% set cool = params.FAN_TIME|default(120)|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE                      ; an old Done button must not turn the heater off mid-print
    M104 S0
    SET_DISPLAY_TEXT MSG="Cooling"
    M106 S255
    G4 S{cool}
    M107
    _STATUS_READY
    SET_DISPLAY_TEXT MSG="Nozzle change done"
    RESPOND MSG="Nozzle change done. PRINT_START touch-homes the new nozzle, so the Z offset does not need redoing."


#####################################################################
#   PID tuning helpers
#####################################################################
## PID_HOTEND / PID_BED open a pop-up of material buttons (KlipperScreen
## and Mainsail both show it). TEMP= skips the pop-up.
## The hotend tunes with the part fan at 25% to match low-fan nylon/PET
## printing. When done, a pop-up offers SAVE_CONFIG (restarts Klipper).

[gcode_macro PID_HOTEND]
description: Pick a temperature and PID-tune the hotend
gcode:
    _CHECK_IDLE
    {% if params.TEMP is defined %}
        _PID_HOTEND_RUN TEMP={params.TEMP|int}
    {% else %}
        {% set mats = [] %}
        {% for m in printer["gcode_macro _MATERIALS"].materials %}
            {% if m.bed > 0 %}{% set _ = mats.append(m) %}{% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin Hotend PID tune"
        RESPOND TYPE=command MSG="action:prompt_text Bed must be clear: the nozzle moves to 10 mm above the bed centre for the tune."
        RESPOND TYPE=command MSG="action:prompt_text Pick the temperature you print at most."
        {% for row in mats|batch(2) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for m in row %}
                RESPOND TYPE=command MSG="action:prompt_button {m.name} {m.hotend}|_PID_HOTEND_RUN TEMP={m.hotend}|primary"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _PID_HOTEND_RUN]
gcode:
    {% set t    = params.TEMP|int %}
    {% set tmax = printer.configfile.settings.extruder.max_temp|float %}
    {% set cx   = printer.toolhead.axis_maximum.x / 2 %}
    {% set cy   = printer.toolhead.axis_maximum.y / 2 %}
    {% if t > tmax - 15 %}
        {action_raise_error("PID target too close to max_temp. The tune overshoots and would trip a shutdown.")}
    {% endif %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    G90
    _HOME_IF_NEEDED
    G0 X{cx} Y{cy} Z10 F18000        ; over the bed so the fan airflow is realistic
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="PID hotend {t}C"
    M106 S64                         ; part fan 25%
    PID_CALIBRATE HEATER=extruder TARGET={t}
    M107
    _STATUS_READY
    _PID_SAVE_PROMPT

[gcode_macro PID_BED]
description: Pick a temperature and PID-tune the bed
gcode:
    _CHECK_IDLE
    {% if params.TEMP is defined %}
        _PID_BED_RUN TEMP={params.TEMP|int}
    {% else %}
        {% set mats  = printer["gcode_macro _MATERIALS"].materials %}
        {% set temps = [] %}
        {% for m in mats %}
            {% if m.bed > 0 and m.bed not in temps %}{% set _ = temps.append(m.bed) %}{% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin Bed PID tune"
        RESPOND TYPE=command MSG="action:prompt_text Pick the bed temperature you use most."
        {% for row in temps|sort|batch(2) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for t in row %}
                {% set names = [] %}
                {% for m in mats %}
                    {% if m.bed == t %}{% set _ = names.append(m.name) %}{% endif %}
                {% endfor %}
                RESPOND TYPE=command MSG="action:prompt_button {names|join('/')} {t}|_PID_BED_RUN TEMP={t}|primary"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _PID_BED_RUN]
gcode:
    {% set t    = params.TEMP|int %}
    {% set tmax = printer.configfile.settings.heater_bed.max_temp|float %}
    {% if t > tmax - 5 %}
        {action_raise_error("PID target too close to the bed max_temp.")}
    {% endif %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="PID bed {t}C"
    PID_CALIBRATE HEATER=heater_bed TARGET={t}
    _STATUS_READY
    _PID_SAVE_PROMPT

[gcode_macro _PID_SAVE_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin PID tune finished"
    RESPOND TYPE=command MSG="action:prompt_text Save the new values? SAVE_CONFIG restarts Klipper."
    RESPOND TYPE=command MSG="action:prompt_footer_button Save|_PID_SAVE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Not now|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

## SAVE_CONFIG restarts Klipper, so an old Save button must not run mid-print
[gcode_macro _PID_SAVE]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    SAVE_CONFIG


#####################################################################
#   Cold pull
#####################################################################
## Heats, packs the nozzle, cools to the pull temperature with the part
## fan, then the extruder pulls the filament out sharply.
## The pull happens below min_extrude_temp (170C), which normal G1 moves
## refuse, so it uses FORCE_MOVE ([force_move] is enabled in printer.cfg).
## Manual use: COLD_PULL HEAT=260 PULL=140

[gcode_macro COLD_PULL]
description: Pick a material and do a cold pull
gcode:
    _CHECK_IDLE
    {% if params.HEAT is defined and params.PULL is defined %}
        _COLD_PULL_RUN HEAT={params.HEAT|int} PULL={params.PULL|int}
    {% else %}
        {% set mats = [] %}
        {% for m in printer["gcode_macro _MATERIALS"].materials %}
            {% if m.pull > 0 %}{% set _ = mats.append(m) %}{% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin Cold pull"
        RESPOND TYPE=command MSG="action:prompt_text Load the cleaning filament first. Heat / pull temperatures shown."
        {% for row in mats|batch(2) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for m in row %}
                RESPOND TYPE=command MSG="action:prompt_button {m.name} {m.hotend}/{m.pull}|_COLD_PULL_RUN HEAT={m.hotend} PULL={m.pull}|primary"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _COLD_PULL_RUN]
gcode:
    {% set heat = params.HEAT|int %}
    {% set pull = params.PULL|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    _CHECK_IDLE
    _FILAMENT_PRESENT
    # Re-inserting filament between pulls should not pop the load prompt
    SET_GCODE_VARIABLE MACRO=_FILAMENT_INSERTED VARIABLE=suppress VALUE=1

    {% set z_lift = [printer.toolhead.position.z, 100]|max %}
    G90
    _HOME_IF_NEEDED
    G0 Z{z_lift} F1800               ; straight up first, never down across the bed
    G0 X175 Y15 F12000               ; then front-centre

    # Heat and pack the nozzle with fresh filament
    _STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Cold pull: heating {heat}C"
    M109 S{heat}
    SAVE_GCODE_STATE NAME=STATE_COLD_PULL
    M83
    G1 E20 F150
    M400
    RESTORE_GCODE_STATE NAME=STATE_COLD_PULL

    # Cool to the pull temperature
    SET_DISPLAY_TEXT MSG="Cold pull: cooling to {pull}C"
    M104 S0
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={pull}
    M107

    # Sensor off so the pull is not treated as a runout
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SET_DISPLAY_TEXT MSG="Cold pull: pulling"
    FORCE_MOVE STEPPER=extruder DISTANCE=-100 VELOCITY=30 ACCEL=1000
    G4 P500
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

    _STATUS_READY
    SET_DISPLAY_TEXT MSG="Cold pull done"
    RESPOND TYPE=command MSG="action:prompt_begin Cold pull done"
    RESPOND TYPE=command MSG="action:prompt_text Check the tip. It is clean when it comes out shaped like the nozzle with no dark specks."
    RESPOND TYPE=command MSG="action:prompt_text To repeat: cut off the pulled tip, push the filament back into the extruder, then press Repeat."
    RESPOND TYPE=command MSG="action:prompt_footer_button Repeat|_COLD_PULL_RUN HEAT={heat} PULL={pull}|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_COLD_PULL_DONE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _COLD_PULL_DONE]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    SET_GCODE_VARIABLE MACRO=_FILAMENT_INSERTED VARIABLE=suppress VALUE=0


#####################################################################
#   Config backup (klipper-backup)
#####################################################################

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

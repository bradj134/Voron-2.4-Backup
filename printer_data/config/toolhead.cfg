#####################################################################
#   Toolhead - A4T, BTT EBB36 Gen2 (CAN), WW-BMG, Dragon UHF
#####################################################################
##  Gen2 pins follow BTT's EBB36 Gen2 pinout and sample config.

[mcu EBBCan]
canbus_uuid: a07fc3c11f67


#####################################################################
#   Extruder and hotend
#####################################################################
##  PID values live in printer.cfg's SAVE_CONFIG block.

[extruder]
step_pin: EBBCan:PB14
dir_pin: !EBBCan:PA8
enable_pin: !EBBCan:PB6
microsteps: 32
rotation_distance: 22.6789511      # BMG starting value, calibrate
full_steps_per_rotation: 200       # 400 if the motor is 0.9 degree
gear_ratio: 50:10                  # BMG gearing
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: EBBCan:PB4
sensor_type: PT1000
sensor_pin: EBBCan:PA3
pullup_resistor: 2200
#pressure_advance: 0.036           # old CW2 value, recalibrate for WW-BMG
min_temp: 0
max_temp: 305
min_extrude_temp: 170              # blocks cold extrusion and grinding
max_extrude_only_distance: 150.0
max_extrude_cross_section: 5       # KAMP's LINE_PURGE skips the purge below 5

## spreadCycle (no stealthchop_threshold) and no hold_current, per
## Klipper's TMC guide: more torque and position accuracy for
## retractions and pressure advance, and no motor nudge when the
## current would drop between moves. A little louder than stealthChop.
[tmc2209 extruder]
uart_pin: EBBCan:PB3
run_current: 0.6                   # CONFIRM against your motor's rating


#####################################################################
#   Fans
#####################################################################

##  Part cooling - Gen2 FAN0
[multi_pin part_fans]
pins: EBBCan:PD3, EBBCan:PA5

[fan]
pin: multi_pin:part_fans
kick_start_time: 0.9
off_below: 0.10

##  Hotend fan - Gen2 FAN2 (3-pin, tach on DET)
[heater_fan hotend_fan]
pin: EBBCan:PD2
tachometer_pin: EBBCan:PA4
max_power: 1.0
kick_start_time: 0.9
heater: extruder
heater_temp: 50.0


#####################################################################
#   Lighting, runout sensor, board temperature
#####################################################################

##  Toolhead LEDs - Gen2 RGB port
[neopixel headlight]
pin: EBBCan:PC7
chain_count: 3          # CONFIRM: number of LEDs on the A4T
color_order: GRBW       # CONFIRM: GRBW for RGBW LEDs, GRB for RGB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

##  Runout sensor inside the WW-BMG - Gen2 FIL port
[filament_switch_sensor filament_sensor]
pause_on_runout: True
runout_gcode:
    _RUNOUT_UNLOAD
insert_gcode:
    _FILAMENT_INSERTED
event_delay: 3.0
pause_delay: 0.5
switch_pin: !EBBCan:PD0             # add ! if it reads backwards

##  Gen2 onboard thermistor, under the motor driver (not a chamber reading)
[temperature_sensor EBB_driver]
sensor_type: Generic 3950
sensor_pin: EBBCan:PA0
pullup_resistor: 2200
min_temp: -40
max_temp: 100

##  Gen2 processor temperature (built into the chip)
[temperature_sensor EBB_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100

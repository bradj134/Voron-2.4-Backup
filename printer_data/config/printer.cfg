#####################################################################
#   Voron 2.4 350 - main config
#   Octopus V1 (USB) + EBB36 Gen2 (CAN) + Cartographer V4 (CAN)
#####################################################################
##  Hardware lives in the included files; this file keeps the main MCU,
##  printer limits and general settings, plus the SAVE_CONFIG block,
##  which Klipper always writes to this file.
##
##  Rule for the split: an option that SAVE_CONFIG stores (PID values,
##  input shaper, Cartographer models) must not also be set in an
##  included file, or SAVE_CONFIG refuses to save.

[include mainsail.cfg]
[include timelapse.cfg]
[include mainboard.cfg]
[include toolhead.cfg]
[include cartographer.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]
[include led_effects.cfg]
[include kinematics_demo.cfg]
## shell_command.cfg (only the HELLO_WORLD test macro) is no longer
## included. The klipper-backup shell commands live in macros.cfg.


#####################################################################
#   Main MCU and printer limits
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_26001B001150535556323420-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5600          # set from input shaper results once tuned
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0


#####################################################################
#   General
#####################################################################

[virtual_sdcard]
path: /home/voron24/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

## G2/G3 arc moves (slicer arc fitting, and the XZ circles in the demo)
[gcode_arcs]

## Needed by COLD_PULL to pull below min_extrude_temp
[force_move]
enable_force_move: True

[idle_timeout]
timeout: 1800    # 30 min

## Host computer temperature (Pi). Shows in Mainsail and KlipperScreen.
## Klipper shuts down above max_temp, so it sits above normal readings.
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100


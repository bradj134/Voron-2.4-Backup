#####################################################################
#   KINEMATICS_DEMO - flying gantry party tricks
#####################################################################
##  Run KINEMATICS_DEMO (or tap it in KlipperScreen's macro list):
##  pick a speed, then pick patterns one at a time from the menu.
##
##  Safety:
##   - refuses to run while printing or paused, or if X, Y and Z are not homed
##   - asks you to confirm the bed is clear before anything moves
##   - every pattern starts by lifting to a safe height (DEMO_Z, clamped
##     below your Z limit) and never descends below it
##   - every move is inside your axis limits minus MARGIN, calculated from
##     your config, not hardcoded. Klipper also rejects any out-of-range
##     move on its own, as a second layer.
##   - speed and accel are capped per level, below your config maximums,
##     and reset to your printer.cfg values after each pattern
##  Klipper cannot interrupt a running macro except with an emergency stop,
##  so patterns are short and you choose the next one each time.

[gcode_macro _DEMO_STATE]
## Tunables
variable_demo_z: 60          ; height patterns run at (mm)
variable_margin: 25          ; distance kept from every XY limit (mm)
variable_xz_radius: 40       ; radius of the vertical XZ circle (mm)
## Internal: current speed level
variable_level: "gentle"
gcode:

## Puts speed, accel and the arc plane back to the printer.cfg values.
## Runs after every pattern, on Done, and when the demo opens, so a
## pattern that stopped partway can't leave the printer slowed down.
[gcode_macro _DEMO_RESTORE]
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    G17
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel}

[gcode_macro _DEMO_CHECK]
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] or printer.pause_resume.is_paused %}
        {action_raise_error("Kinematics demo: not allowed while a print is running or paused.")}
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Kinematics demo: home all axes (G28) first.")}
    {% endif %}

[gcode_macro KINEMATICS_DEMO]
description: Motion party tricks with safety checks
gcode:
    _DEMO_CHECK
    _DEMO_RESTORE
    RESPOND TYPE=command MSG="action:prompt_begin Kinematics demo"
    RESPOND TYPE=command MSG="action:prompt_text Make sure the bed is clear and nothing is near the gantry. Pick a speed."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Gentle|_DEMO_MENU LEVEL=gentle|primary"
    RESPOND TYPE=command MSG="action:prompt_button Showy|_DEMO_MENU LEVEL=showy|primary"
    RESPOND TYPE=command MSG="action:prompt_button Fast|_DEMO_MENU LEVEL=fast|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DEMO_MENU]
gcode:
    {% if params.LEVEL is defined %}
        SET_GCODE_VARIABLE MACRO=_DEMO_STATE VARIABLE=level VALUE='"{params.LEVEL|lower}"'
    {% endif %}
    {% set lvl = params.LEVEL|default(printer["gcode_macro _DEMO_STATE"].level)|lower %}
    RESPOND TYPE=command MSG="action:prompt_begin Demo: {lvl}"
    RESPOND TYPE=command MSG="action:prompt_text Pick a pattern."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Circles|_DEMO_RUN PATTERN=circles|primary"
    RESPOND TYPE=command MSG="action:prompt_button Spiral|_DEMO_RUN PATTERN=spiral|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Star|_DEMO_RUN PATTERN=star|primary"
    RESPOND TYPE=command MSG="action:prompt_button Polygons|_DEMO_RUN PATTERN=polygons|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Lissajous|_DEMO_RUN PATTERN=lissajous|primary"
    RESPOND TYPE=command MSG="action:prompt_button Figure-8|_DEMO_RUN PATTERN=figure8|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Speed ramp|_DEMO_RUN PATTERN=ramp|primary"
    RESPOND TYPE=command MSG="action:prompt_button Z wave|_DEMO_RUN PATTERN=zwave|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button XZ circle (slow, Z-limited)|_DEMO_RUN PATTERN=xzcircle|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Change speed|KINEMATICS_DEMO|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_DEMO_END|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DEMO_RUN]
gcode:
    {% set p = params.PATTERN|default("circles")|lower %}
    {% set valid = ["circles", "spiral", "star", "polygons", "lissajous", "figure8", "ramp", "zwave", "xzcircle"] %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if p not in valid %}
        {action_raise_error("Kinematics demo: unknown pattern " ~ p)}
    {% endif %}
    _DEMO_CHECK
    _DEMO_PREP
    _DEMO_{p|upper}
    _DEMO_FINISH
    _DEMO_MENU

[gcode_macro _DEMO_PREP]
gcode:
    {% set st   = printer["gcode_macro _DEMO_STATE"] %}
    {% set th   = printer.toolhead %}
    {% set cfgv = printer.configfile.settings.printer.max_velocity|float %}
    {% set cfga = printer.configfile.settings.printer.max_accel|float %}
    {% if st.level == "fast" %}
        {% set v, a = [300.0, cfgv]|min, [10000.0, cfga]|min %}
    {% elif st.level == "showy" %}
        {% set v, a = [250.0, cfgv]|min, [6000.0, cfga]|min %}
    {% else %}
        {% set v, a = [150.0, cfgv]|min, [3000.0, cfga]|min %}
    {% endif %}
    {% set z_safe = [st.demo_z, th.axis_maximum.z - st.xz_radius * 2 - 20]|min %}
    SAVE_GCODE_STATE NAME=STATE_DEMO
    G90
    G17
    {% if th.position.z < z_safe %}
        G0 Z{z_safe} F900                 ; lift first, straight up
    {% endif %}
    SET_VELOCITY_LIMIT VELOCITY={v} ACCEL={a}
    _STATUS_PARTY
    G0 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{(th.axis_minimum.y + th.axis_maximum.y) / 2} F{v * 60}

[gcode_macro _DEMO_FINISH]
gcode:
    {% set th = printer.toolhead %}
    M400
    G17                                   ; make sure the arc plane is back to XY
    G0 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{(th.axis_minimum.y + th.axis_maximum.y) / 2} F6000
    _DEMO_RESTORE
    RESTORE_GCODE_STATE NAME=STATE_DEMO
    _STATUS_READY

[gcode_macro _DEMO_END]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    _DEMO_RESTORE
    _STATUS_READY
    RESPOND MSG="Kinematics demo finished."


#####################################################################
#   Patterns. Each works inside the safe box:
#   X/Y from axis_minimum + margin to axis_maximum - margin,
#   Z at the height _DEMO_PREP lifted to (never lower).
#####################################################################

## Concentric circles, big to small (true arcs, two halves each)
[gcode_macro _DEMO_CIRCLES]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% set cx, cy = (x0 + x1) / 2, (y0 + y1) / 2 %}
    {% set rmax = [cx - x0, cy - y0]|min %}
    {% set f = th.max_velocity * 60 %}
    {% for k in [1.0, 0.75, 0.5, 0.25] %}
        {% set r = rmax * k %}
        G0 X{cx + r} Y{cy} F{f}
        G2 X{cx - r} Y{cy} I{0 - r} J0 F{f}
        G2 X{cx + r} Y{cy} I{r} J0 F{f}
    {% endfor %}

## Inward spiral, 4 turns
[gcode_macro _DEMO_SPIRAL]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% set cx, cy = (x0 + x1) / 2, (y0 + y1) / 2 %}
    {% set rmax = [cx - x0, cy - y0]|min %}
    {% set f = th.max_velocity * 60 %}
    {% set pi = 3.14159265 %}
    {% set turns, n = 4, 240 %}
    {% for i in range(n + 1) %}
        {% set t = 2 * pi * turns * i / n %}
        {% set r = rmax * (1 - i / n * 0.9) %}
        {% set s = (t % (2 * pi)) %}{% if s > pi %}{% set s = s - 2 * pi %}{% endif %}
        {% set c = ((t + pi / 2) % (2 * pi)) %}{% if c > pi %}{% set c = c - 2 * pi %}{% endif %}
        {% set sin_t = s - s**3/6 + s**5/120 - s**7/5040 + s**9/362880 - s**11/39916800 %}
        {% set cos_t = c - c**3/6 + c**5/120 - c**7/5040 + c**9/362880 - c**11/39916800 %}
        G1 X{'%.3f' % (cx + r * cos_t)} Y{'%.3f' % (cy + r * sin_t)} F{f}
    {% endfor %}

## Five-point star, twice
[gcode_macro _DEMO_STAR]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% set cx, cy = (x0 + x1) / 2, (y0 + y1) / 2 %}
    {% set r = [cx - x0, cy - y0]|min %}
    {% set f = th.max_velocity * 60 %}
    ## Unit-circle star points, visiting every other vertex
    {% set pts = [(0, 1), (-0.5878, -0.8090), (0.9511, 0.3090), (-0.9511, 0.3090), (0.5878, -0.8090), (0, 1)] %}
    {% for lap in range(2) %}
        {% for px, py in pts %}
            G1 X{'%.3f' % (cx + r * px)} Y{'%.3f' % (cy + r * py)} F{f}
        {% endfor %}
    {% endfor %}

## Triangle, square, hexagon, growing outward
[gcode_macro _DEMO_POLYGONS]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% set cx, cy = (x0 + x1) / 2, (y0 + y1) / 2 %}
    {% set rmax = [cx - x0, cy - y0]|min %}
    {% set f = th.max_velocity * 60 %}
    {% set shapes = [
        (0.45, [(0, 1), (-0.8660, -0.5), (0.8660, -0.5), (0, 1)]),
        (0.70, [(0.7071, 0.7071), (-0.7071, 0.7071), (-0.7071, -0.7071), (0.7071, -0.7071), (0.7071, 0.7071)]),
        (1.00, [(1, 0), (0.5, 0.8660), (-0.5, 0.8660), (-1, 0), (-0.5, -0.8660), (0.5, -0.8660), (1, 0)])
    ] %}
    {% for scale, pts in shapes %}
        {% set r = rmax * scale %}
        {% for px, py in pts %}
            G1 X{'%.3f' % (cx + r * px)} Y{'%.3f' % (cy + r * py)} F{f}
        {% endfor %}
    {% endfor %}

## Lissajous curve, 3:2 ratio, two loops
[gcode_macro _DEMO_LISSAJOUS]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% set cx, cy = (x0 + x1) / 2, (y0 + y1) / 2 %}
    {% set ax, ay = cx - x0, cy - y0 %}
    {% set f = th.max_velocity * 60 %}
    {% set pi = 3.14159265 %}
    {% set n = 240 %}
    {% for i in range(n * 2 + 1) %}
        {% set t = 2 * pi * i / n %}
        {% set u = ((3 * t + pi / 2) % (2 * pi)) %}{% if u > pi %}{% set u = u - 2 * pi %}{% endif %}
        {% set w = ((2 * t) % (2 * pi)) %}{% if w > pi %}{% set w = w - 2 * pi %}{% endif %}
        {% set sx = u - u**3/6 + u**5/120 - u**7/5040 + u**9/362880 - u**11/39916800 %}
        {% set sy = w - w**3/6 + w**5/120 - w**7/5040 + w**9/362880 - w**11/39916800 %}
        G1 X{'%.3f' % (cx + ax * sx)} Y{'%.3f' % (cy + ay * sy)} F{f}
    {% endfor %}

## Figure-8 from two true circles, three times
[gcode_macro _DEMO_FIGURE8]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% set cx, cy = (x0 + x1) / 2, (y0 + y1) / 2 %}
    {% set r = [(cx - x0) / 2, cy - y0]|min %}
    {% set f = th.max_velocity * 60 %}
    G0 X{cx} Y{cy} F{f}
    {% for lap in range(3) %}
        G2 X{cx - 2 * r} Y{cy} I{0 - r} J0 F{f}
        G2 X{cx} Y{cy} I{r} J0 F{f}
        G3 X{cx + 2 * r} Y{cy} I{r} J0 F{f}
        G3 X{cx} Y{cy} I{0 - r} J0 F{f}
    {% endfor %}

## Corner-to-corner sweeps at 25%, 50%, 75% and 100% of the level's speed
[gcode_macro _DEMO_RAMP]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set y0, y1 = th.axis_minimum.y + st.margin, th.axis_maximum.y - st.margin %}
    {% for k in [0.25, 0.5, 0.75, 1.0] %}
        {% set f = th.max_velocity * 60 * k %}
        G1 X{x0} Y{y0} F{f}
        G1 X{x1} Y{y1} F{f}
        G1 X{x0} Y{y1} F{f}
        G1 X{x1} Y{y0} F{f}
    {% endfor %}

## Left-right sweeps while Z bobs up 15 mm (Z speed is the limit here)
[gcode_macro _DEMO_ZWAVE]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set x0, x1 = th.axis_minimum.x + st.margin, th.axis_maximum.x - st.margin %}
    {% set cy = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% set z0 = th.position.z %}
    {% set z1 = [z0 + 15, th.axis_maximum.z - 5]|min %}
    {% set f = th.max_velocity * 60 %}
    G1 X{x0} Y{cy} F{f}
    {% for lap in range(3) %}
        G1 X{x1} Z{z1} F{f}
        G1 X{x0} Z{z0} F{f}
    {% endfor %}

## Vertical circle in the XZ plane, as seen from the front, twice.
## The bottom of the circle is the safe height, so it only goes up from there.
[gcode_macro _DEMO_XZCIRCLE]
gcode:
    {% set st = printer["gcode_macro _DEMO_STATE"] %}
    {% set th = printer.toolhead %}
    {% set cx = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set cy = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% set r  = st.xz_radius %}
    {% set zb = th.position.z %}
    {% set zc = zb + r %}
    {% if zc + r > th.axis_maximum.z - 5 %}
        {action_raise_error("Kinematics demo: XZ circle would exceed the Z limit.")}
    {% endif %}
    {% set f = th.max_velocity * 60 %}
    G0 X{cx} Y{cy} F{f}
    G18                                   ; arcs in the XZ plane
    {% for lap in range(2) %}
        G2 X{cx} Z{zc + r} I0 K{r} F{f}
        G2 X{cx} Z{zb} I0 K{0 - r} F{f}
    {% endfor %}
    G17                                   ; back to the XY plane
